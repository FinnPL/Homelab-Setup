# One Secret for every extra scrape job: the operator takes a single additionalScrapeConfigs
# source, and the bgp.tools URL carries its token in the path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-additional-scrape-configs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: prometheus-additional-scrape-configs
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        additional-scrape-configs.yaml: |
          {{- with .Values.additionalScrapeJobs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if .Values.bgpTools.enabled }}
          - job_name: bgp-tools
            scrape_interval: 120s
            scheme: https
            metrics_path: {{ "{{ (urlParse .url).path }}" }}
            static_configs:
              - targets: [{{ "{{ (urlParse .url).host }}" }}]
          {{- end }}
          {{- $ports := .Values.inventory.fplnet.exporterPorts }}
          {{- range $job, $port := dict "fplnet-node" $ports.node "fplnet-bird" $ports.bird "fplnet-smokeping" $ports.smokeping "fplnet-wireguard" $ports.wireguard }}
          - job_name: {{ $job }}
            static_configs:
              {{- range $router, $r := $.Values.inventory.fplnet.routers }}
              - targets: ['[{{ $r.loopback }}]:{{ $port }}']
                labels:
                  router: {{ $router }}
              {{- end }}
            {{- if eq $job "fplnet-smokeping" }}
            # target: the peer router of a backbone link (wg-er1-dus1.er1.ams1.fplnet.net -> er1.ams1),
            # else the name from fplnetProbeNames, else the address.
            metric_relabel_configs:
              - source_labels: [host]
                target_label: target
              - source_labels: [host]
                regex: 'wg-[^.]+\.(.+)\.fplnet\.net'
                target_label: target
              {{- range $address, $name := $.Values.fplnetProbeNames }}
              - source_labels: [host]
                regex: '{{ $address }}'
                target_label: target
                replacement: {{ $name }}
              {{- end }}
            {{- end }}
          {{- end }}
          # HAProxy (its built-in exporter) and nginx run on the edges only
          {{- range $job, $port := dict "fplnet-haproxy" $ports.haproxy "fplnet-nginx" $ports.nginx }}
          - job_name: {{ $job }}
            static_configs:
              {{- range $router, $r := $.Values.inventory.fplnet.routers }}
              {{- if $r.prefix }}
              - targets: ['[{{ $r.loopback }}]:{{ $port }}']
                labels:
                  router: {{ $router }}
              {{- end }}
              {{- end }}
          {{- end }}
          # Talos runs etcd outside Kubernetes, and ArgoCD never applies the chart's Endpoints for it
          # (Endpoints are excluded resources), so the control plane is a static target.
          - job_name: kube-etcd
            static_configs:
              - targets: ['{{ .Values.inventory.vieta.hosts.cp1.ipv4 }}:2381']
          # The CM4 time server: node_exporter with the GPSDO and chrony textfile metrics
          - job_name: ntp1-node
            static_configs:
              - targets: ['{{ index .Values.inventory.vieta.hosts "ntp1-mgmt" "ipv4" }}:9100']
                labels:
                  host: ntp1-aah1
          {{- with .Values.inventory.minerva }}
          {{- range $job, $port := dict "minerva-nas-node" 9100 "minerva-nas-smartctl" 9633 }}
          - job_name: {{ $job }}
            static_configs:
              - targets: ['{{ regexReplaceAll "/.*" $.Values.inventory.minerva.nas "" }}:{{ $port }}']
                labels:
                  site: minerva
                  host: nas
          {{- end }}
          {{- end }}
          {{- with .Values.fplnetRpkiValidators }}
          - job_name: fplnet-routinator
            static_configs:
              {{- range . }}
              - targets: ['[{{ (index $.Values.inventory.fplnet.routers .).loopback }}]:{{ $.Values.inventory.fplnet.exporterPorts.routinator }}']
                labels:
                  router: {{ . }}
              {{- end }}
          {{- end }}
  {{- if .Values.bgpTools.enabled }}
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.bgpTools.remoteKey }}
        property: prometheus-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  {{- end }}
