inerva{fill:none;stroke:#7b4fae;stroke-width:1.6}.mk-minerva{fill:#7b4fae}.dot-minerva{fill:#7b4fae}.t-vault{fill:#9a6700}.panel-vault{fill:#fdf6e3;stroke:#9a6700;stroke-opacity:.45;stroke-width:1}.node-vault{fill:#ffffff;stroke:#9a6700;stroke-width:1.3}.chip-vault{fill:#fdf6e3;stroke:#9a6700;stroke-opacity:.6;stroke-width:1}.pill-vault{fill:#fdf6e3}.ln-vault{fill:none;stroke:#9a6700;stroke-width:1.6}.mk-vault{fill:#9a6700}.dot-vault{fill:#9a6700}</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="ah-fplnet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-fplnet"/></marker><marker id="ah-vieta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-vieta"/></marker><marker id="ah-minerva" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-minerva"/></marker><marker id="ah-vault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-vault"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><text x="20" y="40" class="xs b up i3">INTERNET</text><rect x="270" y="16" width="430" height="434" rx="12" class="panel-fplnet"/><text x="286" y="40" class="xs b up t-fplnet">FPLNET AS218255</text><rect x="708" y="16" width="236" height="434" rx="12" class="panel-vieta"/><text x="724" y="40" class="xs b up t-vieta">SITES</text><text x="24" y="76" xml:space="preserve"><tspan class="xs b up t-fplnet">EDGE ANYCAST</tspan><tspan class="mono xs i2">   f91::80</tspan></text><text x="24" y="258" xml:space="preserve"><tspan class="xs b up t-vieta">SITE ANYCAST</tspan><tspan class="mono xs i2">   *.relay.lippok.dev</tspan></text><text x="24" y="388" xml:space="preserve"><tspan class="xs b up i2">LAN</tspan><tspan class="mono xs i2">   *.lippok.dev</tspan></text><rect x="24" y="88" width="118" height="40" rx="7" class="node"/><text x="83" y="104.5" class="mono s b" text-anchor="middle">fplnet.net</text><text x="83" y="119.5" class="xs i2" text-anchor="middle">HTTP/3 over UDP</text><rect x="24" y="140" width="118" height="40" rx="7" class="node"/><text x="83" y="156.5" class="mono s b" text-anchor="middle">fplnet.net</text><text x="83" y="171.5" class="xs i2" text-anchor="middle">HTTPS over TCP</text><rect x="24" y="192" width="118" height="40" rx="7" class="node"/><text x="83" y="208.5" class="mono s b" text-anchor="middle">lippok.dev</text><text x="83" y="223.5" class="xs i2" text-anchor="middle">HTTPS</text><rect x="24" y="270" width="118" height="40" rx="7" class="node"/><text x="83" y="286.5" class="mono s b" text-anchor="middle">*.relay</text><text x="83" y="301.5" class="xs i2" text-anchor="middle">IPv4 to any edge</text><rect x="24" y="322" width="118" height="40" rx="7" class="node"/><text x="83" y="338.5" class="mono s b" text-anchor="middle">*.relay</text><text x="83" y="353.5" class="xs i2" text-anchor="middle">IPv6 to f92::/48</text><rect x="24" y="400" width="118" height="40" rx="7" class="node"/><text x="83" y="416.5" class="mono s b" text-anchor="middle">*.lippok.dev</text><text x="83" y="431.5" class="xs i2" text-anchor="middle">on the LAN</text><rect x="160" y="192" width="94" height="40" rx="7" class="node"/><text x="207" y="208.5" class="s b" text-anchor="middle">Cloudflare</text><text x="207" y="223.5" class="xs i2" text-anchor="middle">proxy and cache</text><rect x="298" y="132" width="88" height="170" rx="7" class="node-fplnet"/><rect x="294" y="136" width="88" height="170" rx="7" class="node-fplnet"/><rect x="290" y="140" width="88" height="170" rx="7" class="node-fplnet"/><text x="334" y="214" class="s b" text-anchor="middle">HAProxy</text><text x="334" y="229" class="xs i2" text-anchor="middle">TCP 443</text><text x="334" y="244" class="xs i2" text-anchor="middle">routes by SNI</text><rect x="412" y="80" width="88" height="144" rx="7" class="node-fplnet"/><rect x="408" y="84" width="88" height="144" rx="7" class="node-fplnet"/><rect x="404" y="88" width="88" height="144" rx="7" class="node-fplnet"/><text x="448" y="149" class="s b" text-anchor="middle">nginx</text><text x="448" y="164" class="xs i2" text-anchor="middle">TLS, HTTP/3</text><text x="448" y="179" class="xs i2" text-anchor="middle">static sites</text><rect x="526" y="132" width="166" height="40" rx="7" class="node-fplnet"/><rect x="522" y="136" width="166" height="40" rx="7" class="node-fplnet"/><rect x="518" y="140" width="166" height="40" rx="7" class="node-fplnet"/><text x="601" y="156.5" class="s b" text-anchor="middle">looking glass</text><text x="601" y="171.5" class="xs i2" text-anchor="middle">bird-lg-go, BIRD</text><rect x="518" y="270" width="74" height="92" rx="7" class="node"/><text x="555" y="312.5" class="s b" text-anchor="middle">WireGuard</text><text x="555" y="327.5" class="xs i2" text-anchor="middle">backbone</text><rect x="610" y="270" width="76" height="92" rx="7" class="node-fplnet"/><text x="648" y="305" class="mono xs b" text-anchor="middle">gw1-aah1</text><text x="648" y="320" class="mono xs b" text-anchor="middle">gw1-fbg1</text><text x="648" y="335" class="xs i2" text-anchor="middle">port allowlist</text><rect x="722" y="270" width="210" height="92" rx="7" class="node-vieta"/><text x="827" y="297.5" class="s b" text-anchor="middle">relay services</text><text x="827" y="312.5" class="mono xs" text-anchor="middle">dns.relay</text><text x="827" y="327.5" class="mono xs" text-anchor="middle">site-data.relay</text><text x="827" y="342.5" class="xs i2" text-anchor="middle">Cilium BGP, one /128 each</text><rect x="722" y="400" width="210" height="40" rx="7" class="node-vieta"/><text x="827" y="416.5" class="s b" text-anchor="middle">Gateway (Envoy)</text><text x="827" y="431.5" class="xs i2" text-anchor="middle">LAN VIP, HTTPRoute</text><path d="M142,108 L402,108" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><rect x="184.684" y="99" width="62.6314" height="18" rx="9" class="pill"/><text x="216" y="112.32" class="xs i2" text-anchor="middle">UDP 443</text><path d="M142,160 L288,160" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><path d="M388,160 L402,160" class="ln" marker-end="url(#ah-n)"/><path d="M502,160 L516,160" class="ln" marker-end="url(#ah-n)"/><path d="M142,212 L158,212" class="ln" marker-end="url(#ah-n)"/><path d="M254,212 L288,212" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><path d="M388,212 L402,212" class="ln" marker-end="url(#ah-n)"/><path d="M142,290 L288,290" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><path d="M388,290 L516,290" class="ln" marker-end="url(#ah-n)"/><rect x="415.83" y="281" width="72.3408" height="18" rx="9" class="pill-fplnet"/><text x="452" y="294.32" class="xs i2" text-anchor="middle">PROXY v2</text><path d="M142,342 L516,342" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><path d="M592,316 L608,316" class="ln" marker-end="url(#ah-n)"/><path d="M686,316 L720,316" class="ln-vieta" marker-end="url(#ah-vieta)"/><path d="M142,420 L721,420" class="ln-vieta dash" marker-end="url(#ah-vieta)"/><rect x="349.024" y="411" width="181.953" height="18" rx="9" class="pill"/><text x="440" y="424.32" class="xs i2" text-anchor="middle">Cilium L2 on the LAN, no edge</text></svg>
