apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: site-data
  namespace: site-data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: site-data
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    {{- include "np.dnsProxy" . | nindent 4 }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gatus
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
