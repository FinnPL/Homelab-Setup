apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: apps/authentik
        property: secret-key
    - secretKey: argocd-oidc-client-secret
      remoteRef:
        key: apps/argocd
        property: oidc-client-secret
    - secretKey: grafana-oidc-client-secret
      remoteRef:
        key: apps/grafana
        property: oidc-client-secret
