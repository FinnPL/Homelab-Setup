name: "Vault: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "vault/**"
      - ".github/workflows/vault-deploy.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token for Vault jwt login

concurrency:
  group: vault
  cancel-in-progress: false

jobs:
  terraform:
    name: "vault"
    runs-on: ubuntu-latest
    environment: vault
    defaults:
      run:
        working-directory: ./vault
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: vault-deploy
          export-token: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -lock-timeout=10m -out .planfile -input=false

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: terraform apply -lock-timeout=10m -auto-approve -input=false .planfile
