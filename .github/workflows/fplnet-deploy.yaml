name: "FPLNET: deploy"

# Routers are still installed by hand. Vault roles bind job_workflow_ref to this file, so keep its name.
on:
  pull_request:
    paths:
      - "fplnet/**"
      - ".github/workflows/fplnet-deploy.yaml"
  push:
    branches: [main]
    paths:
      - "fplnet/**"
      - ".github/workflows/fplnet-deploy.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-nixos:
    name: "Validate NixOS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fplnet/nixos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve locked nixpkgs
        run: echo "NIXPKGS=github:NixOS/nixpkgs/$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)" >> "$GITHUB_ENV"

      - name: alejandra (format check)
        run: nix run "${NIXPKGS}#alejandra" -- --check .

      - name: statix (lint)
        run: nix run "${NIXPKGS}#statix" -- check .

      - name: deadnix (dead code)
        run: nix run "${NIXPKGS}#deadnix" -- --fail .

      - name: Evaluate host configurations
        run: |
          for host in $(nix eval .#nixosConfigurations --apply builtins.attrNames --json --no-write-lock-file | jq -r '.[]'); do
            echo "::group::${host}"
            nix eval ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" --raw --no-write-lock-file
            echo
            echo "::endgroup::"
          done

  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: fplnet
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: fplnet-terraform
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./fplnet/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: ${{ github.ref == 'refs/heads/main' && 'fplnet-deploy' || 'fplnet-plan' }}
          jwtGithubAudience: https://vault.cloud.lippok.dev
          secrets: |
            kv/data/fplnet/cloudflare api-token | TF_VAR_cloudflare_api_token

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: ${{ github.ref == 'refs/heads/main' && 'fplnet-deploy' || 'fplnet-plan' }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -lock-timeout=10m -out .planfile -input=false

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/terraform-plan-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./fplnet/terraform
          header: "Terraform Plan (fplnet)"

      - name: Terraform Apply
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply))
        run: terraform apply -lock-timeout=10m -auto-approve -input=false .planfile
