---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: dns
  labels:
    app: dns
  annotations:
    io.cilium/lb-ipam-ips: {{ .Values.inventory.vieta.lan.loadBalancerIPs.dns | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: dns
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
    - name: https
      protocol: TCP
      port: 443
      targetPort: doh

---
# DoH for dns.relay.lippok.dev on the f92 site anycast
apiVersion: v1
kind: Service
metadata:
  name: dns-relay
  namespace: dns
  labels:
    app: dns
    lippok.dev/public: site-anycast
  annotations:
    lbipam.cilium.io/ips: {{ (index .Values.inventory.fplnet.siteServices .Values.relay.name).address | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  selector:
    app: dns
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: doh
    # The edges' HAProxy with PROXY v2
    - name: doh-pp
      protocol: TCP
      port: {{ (index .Values.inventory.fplnet.siteServices .Values.relay.name).proxyPort }}
      targetPort: doh-pp

---
apiVersion: v1
kind: Service
metadata:
  name: dns-metrics
  namespace: dns
  labels:
    app: dns
spec:
  type: ClusterIP
  selector:
    app: dns
  ports:
    - name: blocky-metrics
      protocol: TCP
      port: 4000
      targetPort: 4000
    - name: unbound-metrics
      protocol: TCP
      port: 9167
      targetPort: 9167
