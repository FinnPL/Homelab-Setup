{{- /* Rule names of this chart's own ClusterPolicies. Every other policy an entry lists is a
kyverno-policies ValidatingPolicy and is exempted through policies.kyverno.io instead. */}}
{{- $clusterPolicyRules := dict
      "require-resource-limits" (list "require-limits" "autogen-require-limits")
      "require-ro-rootfs" (list "require-ro-rootfs" "autogen-require-ro-rootfs") }}
{{- range .Values.policyExceptions }}
{{- $legacy := list }}
{{- $cel := list }}
{{- range .policies }}
{{- if hasKey $clusterPolicyRules . }}{{ $legacy = append $legacy . }}{{ else }}{{ $cel = append $cel . }}{{ end }}
{{- end }}
{{- $names := list }}
{{- range .names }}
{{- $n := trimAll "*" . }}
{{- if and (hasPrefix "*" .) (hasSuffix "*" .) }}{{ $names = append $names (printf "object.metadata.name.contains(%q)" $n) }}
{{- else if hasPrefix "*" . }}{{ $names = append $names (printf "object.metadata.name.endsWith(%q)" $n) }}
{{- else if hasSuffix "*" . }}{{ $names = append $names (printf "object.metadata.name.startsWith(%q)" $n) }}
{{- else }}{{ $names = append $names (printf "object.metadata.name == %q" $n) }}{{ end }}
{{- end }}
{{- $labels := list }}
{{- range $k, $v := .labels }}
{{- $l := printf "object.metadata.labels[%q]" $k }}
{{- $has := printf "%q in object.metadata.labels" $k }}
{{- if kindIs "slice" $v }}{{ $labels = append $labels (printf "%s && %s in %s" $has $l (toJson $v)) }}
{{- else }}{{ $labels = append $labels (printf "%s && %s == %q" $has $l $v) }}{{ end }}
{{- end }}
{{- if $cel }}
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ .name }}
  namespace: kyverno
  annotations:
    policies.kyverno.io/description: {{ .description | quote }}
spec:
  policyRefs:
    {{- range $cel }}
    - name: {{ . }}
      kind: ValidatingPolicy
    {{- end }}
  matchConditions:
    - name: namespace
      expression: {{ printf "object.metadata.namespace == %q" .namespace | quote }}
    - name: kind
      expression: {{ printf "object.kind in %s" (toJson .kinds) | quote }}
    {{- with $names }}
    - name: name
      expression: {{ join " || " . | quote }}
    {{- end }}
    {{- with $labels }}
    - name: labels
      expression: {{ printf "has(object.metadata.labels) && %s" (join " && " .) | quote }}
    {{- end }}
{{- end }}
{{- if $legacy }}
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ .name }}
  namespace: kyverno
  annotations:
    policies.kyverno.io/description: {{ .description | quote }}
spec:
  match:
    any:
      - resources:
          namespaces: [{{ .namespace }}]
          kinds: {{ toJson .kinds }}
          {{- with .names }}
          names: {{ toJson . }}
          {{- end }}
          {{- with .labels }}
          selector:
            matchExpressions:
              {{- range $k, $v := . }}
              - key: {{ $k }}
                operator: In
                values: {{ ternary $v (list $v) (kindIs "slice" $v) | toJson }}
              {{- end }}
          {{- end }}
  exceptions:
    {{- range $legacy }}
    - policyName: {{ . }}
      ruleNames: {{ get $clusterPolicyRules . | toJson }}
    {{- end }}
{{- end }}
{{- end }}
