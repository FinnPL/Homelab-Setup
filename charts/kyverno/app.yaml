namespace: kyverno
syncOptions:
  - ServerSideApply=true
  - SkipDryRunOnMissingResource=true
ignoreDifferences:
  - group: kyverno.io
    kind: ClusterPolicy
    jsonPointers:
      - /spec/admission
      - /spec/emitWarning
    jqPathExpressions:
      - .spec.rules[]?.skipBackgroundRequests
      - .spec.rules[]?.validate.allowExistingViolations
  - group: kyverno.io
    kind: Policy
    jsonPointers:
      - /spec/admission
      - /spec/emitWarning
    jqPathExpressions:
      - .spec.rules[]?.skipBackgroundRequests
      - .spec.rules[]?.validate.allowExistingViolations
