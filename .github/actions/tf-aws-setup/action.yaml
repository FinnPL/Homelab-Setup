name: "Terraform + AWS setup"
description: "Install a pinned Terraform and mint short-lived S3 state-backend credentials from Vault"

inputs:
  terraform_version:
    description: "Terraform version to install"
    default: "1.10.0"
  aws-region:
    description: "AWS region of the state bucket"
    default: "eu-central-1"
  vault-addr:
    description: "Vault server URL"
    default: "https://vault.cloud.lippok.dev"
  vault-role:
    description: "Vault jwt role to mint state-backend credentials from. Requires id-token: write on the caller."
    required: true
  export-token:
    description: "Also export VAULT_TOKEN, for callers whose Terraform uses the vault provider."
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Mint state-backend credentials (Vault, GitHub OIDC)
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ inputs.vault-addr }}
        method: jwt
        path: github-actions
        role: ${{ inputs.vault-role }}
        jwtGithubAudience: ${{ inputs.vault-addr }}
        exportToken: ${{ inputs.export-token }}
        secrets: |
          aws/creds/tfstate access_key | AWS_ACCESS_KEY_ID ;
          aws/creds/tfstate secret_key | AWS_SECRET_ACCESS_KEY ;
          aws/creds/tfstate security_token | AWS_SESSION_TOKEN

    - name: Set AWS region
      shell: bash
      run: echo "AWS_REGION=${{ inputs.aws-region }}" >> "$GITHUB_ENV"
