namespace: gateway

gateway:
  name: main-gateway
  namespace: gateway
  sectionName: https

proxy:
  image: nginxinc/nginx-unprivileged:1.31-alpine
  containerPort: 8080
  resolver: kube-dns.kube-system.svc.cluster.local
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

backends:
  - name: apollo
    hostname: apollo.lippok.dev
    servicePort: 5000
    upstreamHost: '{{ .Values.inventory.vieta.hosts.apollo.dns }}'
    upstreamPort: 5000

  - name: zeus
    hostname: zeus.lippok.dev
    servicePort: 80
    upstreamHost: '{{ .Values.inventory.minerva.hosts.zeus.dns }}'
    upstreamPort: 80

  - name: fritzbox
    hostname: fb.lippok.dev
    servicePort: 80
    endpoints:
      - '{{ .Values.inventory.minerva.fritzbox }}'

  - name: proxmox
    hostname: pve.lippok.dev
    servicePort: 80
    upstreamHost: '{{ .Values.inventory.vieta.hosts.nuc.dns }}'
    upstreamPort: 8006
    upstreamProtocol: https
    enableWebsockets: true
