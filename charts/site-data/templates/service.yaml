apiVersion: v1
kind: Service
metadata:
  name: site-data-relay
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: site-data
    lippok.dev/public: site-anycast
  annotations:
    lbipam.cilium.io/ips: {{ .Values.relay.address | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  selector:
    app.kubernetes.io/name: site-data
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
