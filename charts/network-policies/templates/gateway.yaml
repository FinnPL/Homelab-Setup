{{- $vieta := .Values.inventory.vieta }}
{{- $minerva := .Values.inventory.minerva }}
{{- range $name, $target := dict "apollo" (list $vieta.hosts.apollo.ipv4 5000) "fritzbox" (list $minerva.fritzbox 80) "proxmox" (list $vieta.hosts.nuc.ipv4 8006) "zeus" (list $minerva.hosts.zeus.ipv4 80) }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-external-proxy
  namespace: gateway
spec:
  endpointSelector:
    matchLabels:
      app: {{ $name }}-external-proxy
  ingress:
    {{- include "np.fromGateway" (list 8080) | nindent 4 }}
  egress:
    - toCIDR:
        - {{ index $target 0 }}/32
      toPorts:
        - ports:
            - port: {{ index $target 1 | quote }}
              protocol: TCP
{{- end }}
