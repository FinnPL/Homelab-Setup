name: "Vault: seed infra secrets (one-shot)"

# TEMPORARY, one-shot. Copies the GitHub CI secrets that live only in Actions
# (provider tokens + Ansible-passed passwords — not in TF state or k8s) into
# Vault KV at their kv/* paths, then this branch is deleted. DO NOT MERGE.
#
# Auth: OIDC -> the throwaway `github-actions/kv-seed` Vault role (write-only to
# the infra kv paths), created out-of-band and deleted right after seeding.
# Secret values are read from env and POSTed via the API — never echoed, and
# empty/absent secrets are skipped.

on:
  pull_request:
    paths:
      - ".github/workflows/vault-seed-secrets.yaml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: vault-seed
  cancel-in-progress: false

jobs:
  seed:
    name: "seed"
    runs-on: ubuntu-latest
    environment: Terraform # reaches the Terraform-env secrets
    env:
      # hardcoded: VAULT_ADDR var lives on the `vault` env, not `Terraform`
      VAULT_ADDR: https://vault.cloud.lippok.dev
    steps:
      - name: Vault Login (GitHub OIDC)
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: kv-seed
          jwtGithubAudience: https://vault.cloud.lippok.dev
          exportToken: true

      - name: Seed KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNIFI_API_KEY: ${{ secrets.UNIFI_API_KEY }}
          PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          PROXMOX_SSH_PASSWORD: ${{ secrets.PROXMOX_SSH_PASSWORD }}
          PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
          NFS_ROOT_PASSWORD: ${{ secrets.NFS_ROOT_PASSWORD }}
          POSTGRES_ROOT_PASSWORD: ${{ secrets.POSTGRES_ROOT_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          MESH_ROUTER_ROOT_PASSWORD: ${{ secrets.MESH_ROUTER_ROOT_PASSWORD }}
          MESH_ROUTER_WG_PRIVATE_KEY: ${{ secrets.MESH_ROUTER_WG_PRIVATE_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_EDGE_SSH_HOSTKEY_SHA: ${{ secrets.OCI_EDGE_SSH_HOSTKEY_SHA }}
          CLOUD_WG_PRIVATE_KEY: ${{ secrets.CLOUD_WG_PRIVATE_KEY }}
          MESH_ROUTER_WG_PUBKEY: ${{ secrets.MESH_ROUTER_WG_PUBKEY }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          MYIP_CLOUDFLARE_API: ${{ secrets.MYIP_CLOUDFLARE_API }}
          GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}
          IP: ${{ secrets.IP }}
          IPAPIIS_API_KEY: ${{ secrets.IPAPIIS_API_KEY }}
          IPCHECKING_API_KEY: ${{ secrets.IPCHECKING_API_KEY }}
          IPINFO_API_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          python3 - <<'PY'
          import os, json, sys, urllib.request

          addr = os.environ["VAULT_ADDR"].rstrip("/")
          token = os.environ["VAULT_TOKEN"]  # exported by vault-action

          # kv path (under kv/data/) -> { vault field: source env var }
          MAP = {
              "cloudflare":         {"api-token": "CLOUDFLARE_API_TOKEN"},
              "vieta/unifi":        {"api-key": "UNIFI_API_KEY"},
              "vieta/proxmox":      {"api-token": "PROXMOX_API_TOKEN", "ssh-password": "PROXMOX_SSH_PASSWORD", "ssh-private-key": "PROXMOX_SSH_KEY"},
              "vieta/nfs":          {"root-password": "NFS_ROOT_PASSWORD"},
              "vieta/postgres":     {"root-password": "POSTGRES_ROOT_PASSWORD", "admin-password": "POSTGRES_ADMIN_PASSWORD"},
              "vieta/mesh-router":  {"root-password": "MESH_ROUTER_ROOT_PASSWORD", "wg-private-key": "MESH_ROUTER_WG_PRIVATE_KEY"},
              "ci/tailscale":       {"oauth-client-id": "TS_OAUTH_CLIENT_ID", "oauth-secret": "TS_OAUTH_SECRET"},
              "cloud-edge/oci":     {"tenancy-ocid": "OCI_TENANCY_OCID", "user-ocid": "OCI_USER_OCID", "fingerprint": "OCI_FINGERPRINT", "compartment-ocid": "OCI_COMPARTMENT_OCID", "private-key": "OCI_PRIVATE_KEY", "ssh-private-key": "OCI_SSH_PRIVATE_KEY", "edge-ssh-hostkey-sha": "OCI_EDGE_SSH_HOSTKEY_SHA"},
              "cloud-edge/wg":      {"private-key": "CLOUD_WG_PRIVATE_KEY", "mesh-peer-pubkey": "MESH_ROUTER_WG_PUBKEY"},
              "cloud-edge/maxmind": {"account-id": "MAXMIND_ACCOUNT_ID", "license-key": "MAXMIND_LICENSE_KEY"},
              "cloud-edge/myip":    {"cloudflare-api": "MYIP_CLOUDFLARE_API", "google-map-api-key": "GOOGLE_MAP_API_KEY", "ip": "IP", "ipapiis": "IPAPIIS_API_KEY", "ipchecking": "IPCHECKING_API_KEY", "ipinfo": "IPINFO_API_TOKEN"},
              "minerva/tailscale":  {"authkey": "TAILSCALE_AUTHKEY"},
          }

          failed = False
          for path, fields in MAP.items():
              data = {field: os.environ.get(env, "") for field, env in fields.items()}
              data = {k: v for k, v in data.items() if v}  # drop empty/absent
              if not data:
                  print(f"skip  kv/{path} (no values present)")
                  continue
              req = urllib.request.Request(
                  f"{addr}/v1/kv/data/{path}",
                  data=json.dumps({"data": data}).encode(),
                  method="POST",
                  headers={"X-Vault-Token": token, "Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(req, timeout=15)
                  print(f"seed  kv/{path} ({len(data)} keys)")
              except Exception as e:
                  print(f"FAIL  kv/{path}: {e}")
                  failed = True

          sys.exit(1 if failed else 0)
          PY

  # TAILSCALE_AUTHKEY lives only on the Pi3 environment (minerva's runner), which
  # the Terraform-env job above can't read. Pi3 env is main-only, so this branch
  # is temporarily whitelisted in the Pi3 env for this PR (reverted in cleanup).
  seed-minerva:
    name: "seed-minerva"
    runs-on: pi3
    environment: Pi3
    env:
      VAULT_ADDR: https://vault.cloud.lippok.dev
    steps:
      - name: Vault Login (GitHub OIDC)
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: kv-seed
          jwtGithubAudience: https://vault.cloud.lippok.dev
          exportToken: true

      - name: Seed minerva authkey
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          [ -n "${TAILSCALE_AUTHKEY:-}" ] || { echo "TAILSCALE_AUTHKEY empty"; exit 1; }
          curl -sf --retry 3 -H "X-Vault-Token: $VAULT_TOKEN" \
            -X POST -d "{\"data\":{\"authkey\":\"$TAILSCALE_AUTHKEY\"}}" \
            "$VAULT_ADDR/v1/kv/data/minerva/tailscale" >/dev/null
          echo "seeded kv/minerva/tailscale"
