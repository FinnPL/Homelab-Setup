# user CA:
#   CI authenticates with a short-lived certificate from the
#   ssh-client-signer 'homelab' role instead of a stored private key.
# host CA:
#   this host gets a certificate from the
#   ssh-host-signer 'homelab-host' role so clients CAN verify it by CA.
#
# The host certificate is renewed once it drops below
# vault_ssh_host_cert_renew_days of remaining life.
- name: Install the Vault SSH user CA
  copy:
    src: files/vault_user_ca.pub
    dest: /etc/ssh/vault_user_ca.pub
    mode: "0644"
  register: vault_ssh_ca_key

- name: Trust the Vault user CA for SSH logins
  copy:
    content: "TrustedUserCAKeys /etc/ssh/vault_user_ca.pub\n"
    dest: /etc/ssh/sshd_config.d/10-vault-user-ca.conf
    mode: "0644"
  register: vault_ssh_ca_conf

- name: Read the current host certificate
  include_tasks: ssh-host-cert-validity.yml

- name: Decide whether the host certificate needs renewing
  set_fact:
    vault_ssh_host_cert_renew: >-
      {{ (vault_ssh_host_cert_days_left | int) < (vault_ssh_host_cert_renew_days | default(30) | int) }}

- name: Report the host certificate state
  debug:
    msg: >-
      {{ ((vault_ssh_host_cert_days_left | int) < 0)
         | ternary('no usable host certificate',
                   'host certificate expires in ' ~ vault_ssh_host_cert_days_left ~ ' days') }};
      {{ (vault_ssh_host_cert_renew | bool) | ternary('renewing', 'leaving it in place') }}

- name: Read the host SSH public key
  slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: vault_ssh_host_pubkey
  when: vault_ssh_host_cert_renew | bool

- name: Have Vault sign the host key
  delegate_to: localhost
  become: false
  no_log: true
  when: vault_ssh_host_cert_renew | bool
  uri:
    url: "{{ vault_addr | default('https://vault.cloud.lippok.dev') }}/v1/ssh-host-signer/sign/homelab-host"
    method: PUT
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    body_format: json
    body:
      public_key: "{{ vault_ssh_host_pubkey.content | b64decode }}"
      cert_type: host
      valid_principals: "{{ inventory_hostname }},{{ vault_ssh_host_dns_name }}"
    status_code: 200
  register: vault_ssh_host_cert

- name: Install the Vault-signed host certificate
  copy:
    content: "{{ vault_ssh_host_cert.json.data.signed_key }}\n"
    dest: /etc/ssh/ssh_host_ed25519_key-cert.pub
    mode: "0644"
  register: vault_ssh_host_cert_key
  when: vault_ssh_host_cert_renew | bool

- name: Present the host certificate to SSH clients
  copy:
    content: "HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub\n"
    dest: /etc/ssh/sshd_config.d/20-vault-host-cert.conf
    mode: "0644"
  register: vault_ssh_host_cert_conf

- name: Verify sshd config before reloading
  command: sshd -t
  changed_when: false
  when: >-
    vault_ssh_ca_key.changed or vault_ssh_ca_conf.changed
    or (vault_ssh_host_cert_key.changed | default(false))
    or vault_ssh_host_cert_conf.changed

- name: Reload sshd
  systemd:
    name: ssh
    state: reloaded
  when: >-
    vault_ssh_ca_key.changed or vault_ssh_ca_conf.changed
    or (vault_ssh_host_cert_key.changed | default(false))
    or vault_ssh_host_cert_conf.changed

- name: Re-read the host certificate after renewal
  include_tasks: ssh-host-cert-validity.yml
  when: vault_ssh_host_cert_renew | bool

- name: Fail while the host certificate can still be renewed remotely
  assert:
    that:
      - (vault_ssh_host_cert_days_left | int) >= (vault_ssh_host_cert_min_days | default(14) | int)
    fail_msg: >-
      {{ inventory_hostname }} has {{ vault_ssh_host_cert_days_left }} days of host certificate
      left and renewal is not taking. Fix it before it expires — afterwards the converge fails
      closed and recovery needs a dispatch with allow_host_tofu=true.
    success_msg: >-
      Host certificate valid for another {{ vault_ssh_host_cert_days_left }} days.
