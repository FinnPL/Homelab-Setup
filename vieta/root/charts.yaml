# One Application per vieta/apps/<chart>.yaml, rendering charts/<chart> with values.yaml plus
# values-vieta.yaml where the chart has one (Vieta's deltas from the shared defaults).
# Keys in the app file (all optional):
#   name               Application name (default: file name)
#   namespace          destination namespace
#   cascadeDelete      false drops the resources finalizer, so deleting the Application leaves its resources
#   directory          plain manifest directory instead of a Helm chart (no values files)
#   directoryRecurse   the same, including subdirectories
#   syncOptions        appended to CreateNamespace=true
#   ignoreDifferences  passed through verbatim
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: charts
  namespace: argocd
  annotations:
    # The root app must never prune or delete this object.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Removing a chart means deleting its Application by hand.
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/FinnPL/Homelab-Setup.git
        revision: main
        files:
          - path: vieta/apps/*.yaml
  template:
    metadata:
      name: '{{ dig "name" (trimSuffix ".yaml" .path.filename) . }}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/FinnPL/Homelab-Setup.git
        targetRevision: main
        path: 'charts/{{ trimSuffix ".yaml" .path.filename }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ dig "namespace" "" . }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # No cross-app ordering: a sync that fails on a missing CRD or namespace retries until its dependency has synced.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if dig "cascadeDelete" true . }}
    metadata:
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    {{- end }}
    spec:
      {{- if dig "directoryRecurse" false . }}
      source:
        directory:
          recurse: true
      {{- else if not (dig "directory" false .) }}
      source:
        helm:
          valueFiles: [values-vieta.yaml]
          ignoreMissingValueFiles: true
      {{- end }}
      syncPolicy:
        syncOptions: {{ prepend (dig "syncOptions" (list) .) "CreateNamespace=true" | toJson }}
      {{- with dig "ignoreDifferences" (list) . }}
      ignoreDifferences: {{ toJson . }}
      {{- end }}
