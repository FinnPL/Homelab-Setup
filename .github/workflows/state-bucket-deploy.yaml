name: "State bucket: deploy"

# The S3 bucket that holds every Terraform root's state.
#   push to main      -> plan + apply
#   pull_request      -> plan + comment
#   workflow_dispatch -> plan, apply only when asked

on:
  push:
    branches:
      - main
    paths:
      - "state-bucket/**"
      - ".github/workflows/state-bucket-deploy.yaml"
  pull_request:
    paths:
      - "state-bucket/**"
      - ".github/workflows/state-bucket-deploy.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_terraform-layer.yaml
    secrets: inherit
    with:
      layer: state-bucket
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}
