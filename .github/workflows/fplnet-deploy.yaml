name: "FPLNET: deploy"

# Routers are installed by hand (nixos-anywhere)
# Vault roles bind job_workflow_ref to this file, so keep its name.
on:
  pull_request:
    paths:
      - "fplnet/**"
      - "homepage/**"
      - ".github/workflows/fplnet-deploy.yaml"
  push:
    branches: [main]
    paths:
      - "fplnet/**"
      - "homepage/**"
      - ".github/workflows/fplnet-deploy.yaml"
  # Rebuilds lippok.dev for new GitHub repo metadata, charts and Terraform.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false
      deploy_nixos:
        description: "Deploy every router with deploy-rs"
        type: boolean
        default: false
      deploy_homepage:
        description: "Build lippok.dev and deploy it to the edges"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nixos: ${{ steps.filter.outputs.nixos }}
      homepage: ${{ steps.filter.outputs.homepage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: filter
        with:
          filters: |
            nixos:
              - 'fplnet/nixos/**'
              - 'fplnet/hosts.json'
              - 'fplnet/scripts/**'
            homepage:
              - 'homepage/**'

  validate-nixos:
    if: github.event_name != 'schedule'
    name: "Validate NixOS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fplnet/nixos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve locked nixpkgs
        run: echo "NIXPKGS=github:NixOS/nixpkgs/$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)" >> "$GITHUB_ENV"

      - name: alejandra (format check)
        run: nix run "${NIXPKGS}#alejandra" -- --check .

      - name: statix (lint)
        run: nix run "${NIXPKGS}#statix" -- check .

      - name: deadnix (dead code)
        run: nix run "${NIXPKGS}#deadnix" -- --fail .

      - name: Evaluate host configurations
        run: |
          for host in $(nix eval .#nixosConfigurations --apply builtins.attrNames --json --no-write-lock-file | jq -r '.[]'); do
            echo "::group::${host}"
            nix eval ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" --raw --no-write-lock-file
            echo
            echo "::endgroup::"
          done
          # Host can be configured before it is deployed.
          for host in $(jq -r 'keys[]' ../hosts.json); do
            echo "::group::deploy ${host}"
            nix eval ".#deploy.nodes.${host}.profiles.system.path.drvPath" --raw --no-write-lock-file
            echo
            echo "::endgroup::"
          done

  terraform:
    if: github.event_name != 'schedule'
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: fplnet
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: fplnet-terraform
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./fplnet/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: ${{ github.ref == 'refs/heads/main' && 'fplnet-deploy' || 'fplnet-plan' }}
          jwtGithubAudience: https://vault.cloud.lippok.dev
          secrets: |
            kv/data/fplnet/cloudflare api-token | TF_VAR_cloudflare_api_token

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: ${{ github.ref == 'refs/heads/main' && 'fplnet-deploy' || 'fplnet-plan' }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -lock-timeout=10m -out .planfile -input=false

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/terraform-plan-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./fplnet/terraform
          header: "Terraform Plan (fplnet)"

      - name: Terraform Apply
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply))
        run: terraform apply -lock-timeout=10m -auto-approve -input=false .planfile

  deploy-nixos:
    needs: [changes, validate-nixos]
    if: |
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.nixos == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_nixos)
      )
    name: "NixOS Deploy"
    runs-on: ubuntu-latest
    environment: fplnet
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: fplnet-hosts
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Log in to Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: fplnet-deploy
          jwtGithubAudience: https://vault.cloud.lippok.dev
          exportToken: true

      - name: Mint router SSH certificate
        id: ssh_cert
        uses: ./.github/actions/vault-ssh-client-cert
        with:
          role: fplnet

      # gw1-aah1 is only reachable on the Vieta LAN.
      - name: Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_FPLNET_CLIENT_ID }}
          audience: api.tailscale.com/${{ vars.TAILSCALE_FPLNET_CLIENT_ID }}
          tags: tag:ci

      - name: Deploy
        env:
          SSH_KEY: ${{ steps.ssh_cert.outputs.key-path }}
        run: bash ./fplnet/scripts/fplnet-workflow.sh deploy

  homepage-build:
    needs: changes
    if: |
      needs.changes.outputs.homepage == 'true' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_homepage)
    name: "Homepage Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./homepage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: homepage/package-lock.json

      - run: npm ci

      - run: npm run check

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homepage-dist
          path: homepage/dist
          retention-days: 1

  deploy-homepage:
    needs: [homepage-build, deploy-nixos]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs['homepage-build'].result == 'success' &&
      (needs['deploy-nixos'].result == 'success' || needs['deploy-nixos'].result == 'skipped')
    name: "Homepage Deploy"
    runs-on: ubuntu-latest
    environment: fplnet
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: fplnet-hosts
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homepage-dist
          path: homepage/dist

      - name: Log in to Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: fplnet-deploy
          jwtGithubAudience: https://vault.cloud.lippok.dev
          exportToken: true

      - name: Mint router SSH certificate
        id: ssh_cert
        uses: ./.github/actions/vault-ssh-client-cert
        with:
          role: fplnet

      - name: Deploy
        env:
          SSH_KEY: ${{ steps.ssh_cert.outputs.key-path }}
          HOMEPAGE_DIST: ${{ github.workspace }}/homepage/dist
          HOMEPAGE_RELEASE: ${{ github.sha }}
        run: bash ./fplnet/scripts/fplnet-workflow.sh homepage
