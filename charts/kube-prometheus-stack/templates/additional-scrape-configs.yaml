# One Secret for every extra scrape job: the operator takes a single additionalScrapeConfigs
# source, and the bgp.tools URL carries its token in the path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-additional-scrape-configs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: prometheus-additional-scrape-configs
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        additional-scrape-configs.yaml: |
          {{- with .Values.additionalScrapeJobs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if .Values.bgpTools.enabled }}
          - job_name: bgp-tools
            scrape_interval: 120s
            scheme: https
            metrics_path: {{ "{{ (urlParse .url).path }}" }}
            static_configs:
              - targets: [{{ "{{ (urlParse .url).host }}" }}]
          {{- end }}
          {{- range $job, $port := dict "fplnet-node" 9100 "fplnet-bird" 9324 "fplnet-smokeping" 9374 }}
          - job_name: {{ $job }}
            static_configs:
              {{- range $router, $address := $.Values.fplnetRouters }}
              - targets: ['[{{ $address }}]:{{ $port }}']
                labels:
                  router: {{ $router }}
              {{- end }}
            {{- if eq $job "fplnet-smokeping" }}
            # target: the peer router of a backbone link (wg-er1-dus1.er1.ams1.fplnet.net -> er1.ams1),
            # else the name from fplnetProbeNames, else the address.
            metric_relabel_configs:
              - source_labels: [host]
                target_label: target
              - source_labels: [host]
                regex: 'wg-[^.]+\.(.+)\.fplnet\.net'
                target_label: target
              {{- range $address, $name := $.Values.fplnetProbeNames }}
              - source_labels: [host]
                regex: '{{ $address }}'
                target_label: target
                replacement: {{ $name }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.fplnetRpkiValidators }}
          - job_name: fplnet-routinator
            static_configs:
              {{- range . }}
              - targets: ['[{{ index $.Values.fplnetRouters . }}]:8323']
                labels:
                  router: {{ . }}
              {{- end }}
          {{- end }}
  {{- if .Values.bgpTools.enabled }}
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.bgpTools.remoteKey }}
        property: prometheus-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  {{- end }}
