---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: dns
  labels:
    app: dns
  annotations:
    io.cilium/lb-ipam-ips: "10.10.1.201"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: dns
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443

---
# DoH for dns.relay.lippok.dev on the f92 site anycast (fplnet/nixos/site-services.json).
apiVersion: v1
kind: Service
metadata:
  name: dns-relay
  namespace: dns
  labels:
    app: dns
    lippok.dev/public: site-anycast
  annotations:
    lbipam.cilium.io/ips: "2a0c:b641:f92::53"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  selector:
    app: dns
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https

---
apiVersion: v1
kind: Service
metadata:
  name: dns-metrics
  namespace: dns
  labels:
    app: dns
spec:
  type: ClusterIP
  selector:
    app: dns
  ports:
    - name: blocky-metrics
      protocol: TCP
      port: 4000
      targetPort: 4000
    - name: unbound-metrics
      protocol: TCP
      port: 9167
      targetPort: 9167
