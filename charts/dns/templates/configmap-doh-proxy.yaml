{{- define "dns.dohLocations" }}
location ~ ^/dns-query(/[A-Za-z0-9._-]+)?$ {
  limit_except GET POST { deny all; }
  proxy_pass http://127.0.0.1:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-For $remote_addr;
}

location = /healthz {
  default_type text/plain;
  return 200 "ok\n";
}

location / {
  return 404;
}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: doh-proxy
  namespace: dns
data:
  default.conf: |
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # LAN VIP and native IPv6 to the site-anycast address: the TCP peer is the client.
    server {
      listen 8443 ssl;
      listen [::]:8443 ssl;
      http2 on;
      {{- include "dns.dohLocations" . | nindent 6 }}
    }

    # The edges' HAProxy (IPv4 clients) with PROXY v2.
    server {
      listen 8444 ssl proxy_protocol;
      listen [::]:8444 ssl proxy_protocol;
      http2 on;
      set_real_ip_from 2a0c:b641:f98::/46;
      real_ip_header proxy_protocol;
      {{- include "dns.dohLocations" . | nindent 6 }}
    }
