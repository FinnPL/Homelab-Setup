e;stroke:#7b4fae;stroke-width:1.6}.mk-minerva{fill:#7b4fae}.dot-minerva{fill:#7b4fae}.t-vault{fill:#9a6700}.panel-vault{fill:#fdf6e3;stroke:#9a6700;stroke-opacity:.45;stroke-width:1}.node-vault{fill:#ffffff;stroke:#9a6700;stroke-width:1.3}.chip-vault{fill:#fdf6e3;stroke:#9a6700;stroke-opacity:.6;stroke-width:1}.pill-vault{fill:#fdf6e3}.ln-vault{fill:none;stroke:#9a6700;stroke-width:1.6}.mk-vault{fill:#9a6700}.dot-vault{fill:#9a6700}</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="ah-fplnet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-fplnet"/></marker><marker id="ah-vieta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-vieta"/></marker><marker id="ah-minerva" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-minerva"/></marker><marker id="ah-vault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-vault"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><rect x="16" y="30" width="210" height="54" rx="8" class="node"/><text x="32" y="53" class="b">GitHub Actions job</text><text x="32" y="71" class="s i2">OIDC: repo, workflow, ref</text><rect x="16" y="110" width="210" height="54" rx="8" class="node"/><text x="32" y="133" class="b">External Secrets</text><text x="32" y="151" class="s i2">ServiceAccount token</text><rect x="16" y="246" width="210" height="54" rx="8" class="node-minerva"/><text x="32" y="269" class="b">Admin</text><text x="32" y="287" class="s i2">YubiKey, FIDO2</text><rect x="300" y="22" width="250" height="176" rx="12" class="panel-vault"/><text x="318" y="50" class="b l t-vault">Vault</text><text x="532" y="50" class="mono s i3" text-anchor="end">vault/</text><text x="318" y="80" class="mono s b">github-actions</text><text x="318" y="98" class="s i2">deploy roles: main only</text><text x="318" y="114" class="s i2">plan roles: any ref, read only</text><text x="318" y="146" class="mono s b">&lt;site&gt;-cluster</text><text x="318" y="164" class="s i2">one mount per cluster</text><path d="M226,57 L254,57 Q262,57 262,65 L262,68 Q262,76 270,76 L299,76" class="ln-vault" marker-end="url(#ah-vault)"/><text x="236" y="50" class="xs i2">20 min</text><path d="M226,137 L254,137 Q262,137 262,139.5 L262,139.5 Q262,142 270,142 L299,142" class="ln-vault" marker-end="url(#ah-vault)"/><rect x="620" y="24" width="140.808" height="24" rx="6" class="chip-vault"/><text x="690.404" y="40.32" class="mono s b" text-anchor="middle">ssh-client-signer</text><text x="770.808" y="40" class="s i2">SSH client cert per run</text><path d="M550,110 L584,110 Q590,110 590,104 L590,42 Q590,36 596,36 L619,36" class="ln-vault" marker-end="url(#ah-vault)"/><rect x="620" y="60" width="126.36" height="24" rx="6" class="chip-vault"/><text x="683.18" y="76.32" class="mono s b" text-anchor="middle">ssh-host-signer</text><text x="756.36" y="76" class="s i2">host certs, checked by CI</text><path d="M550,110 L584,110 Q590,110 590,104 L590,78 Q590,72 596,72 L619,72" class="ln-vault" marker-end="url(#ah-vault)"/><rect x="620" y="96" width="148.032" height="24" rx="6" class="chip-vault"/><text x="694.016" y="112.32" class="mono s b" text-anchor="middle">pki-talos, pki-k8s</text><text x="778.032" y="112" class="s i2">cluster client certs, hours</text><path d="M550,110 L584,110 Q590,110 590,109 L590,109 Q590,108 596,108 L619,108" class="ln-vault" marker-end="url(#ah-vault)"/><rect x="620" y="132" width="39.672" height="24" rx="6" class="chip-vault"/><text x="639.836" y="148.32" class="mono s b" text-anchor="middle">aws</text><text x="669.672" y=