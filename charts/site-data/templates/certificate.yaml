apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: site-data-relay-tls
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: site-data-relay-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.relay.lippok.dev"
