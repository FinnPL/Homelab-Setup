# Site totals for lippok.dev (charts/site-data reads the site:* series). Aggregates only.
# Every site's Prometheus records its own cluster under its own site label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: site-data
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: site-data
      interval: 30s
      rules:
        - record: site:nodes:count
          expr: count(kube_node_info)
          labels:
            site: {{ .Values.site }}
        - record: site:nodes_ready:count
          expr: sum(kube_node_status_condition{condition="Ready",status="true"})
          labels:
            site: {{ .Values.site }}
        - record: site:pods_running:count
          expr: sum(kube_pod_status_phase{phase="Running"})
          labels:
            site: {{ .Values.site }}
        - record: site:cpu_used:ratio
          expr: 1 - avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))
          labels:
            site: {{ .Values.site }}
        - record: site:memory_used:ratio
          expr: 1 - sum(node_memory_MemAvailable_bytes{job="node-exporter"}) / sum(node_memory_MemTotal_bytes{job="node-exporter"})
          labels:
            site: {{ .Values.site }}
        - record: site:argocd_apps:count
          expr: count(argocd_app_info)
          labels:
            site: {{ .Values.site }}
        - record: site:argocd_apps_synced:count
          expr: count(argocd_app_info{sync_status="Synced"}) or count(argocd_app_info) * 0
          labels:
            site: {{ .Values.site }}
        - record: site:argocd_apps_healthy:count
          expr: count(argocd_app_info{health_status="Healthy"}) or count(argocd_app_info) * 0
          labels:
            site: {{ .Values.site }}
        # The NAS is scraped from here; labelled with the site it stands at
        - record: site:nas_pool_online:bool
          expr: max(node_zfs_zpool_state{job="minerva-nas-node",zpool="nas",state="online"})
          labels:
            site: minerva
        - record: site:nas_free:bytes
          expr: max(node_filesystem_avail_bytes{job="minerva-nas-node",mountpoint="/nas"})
          labels:
            site: minerva
