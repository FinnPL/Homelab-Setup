name: "Charts: validate"

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "*/apps/**"
      - "*/root/**"
      - ".github/workflows/charts-validate.yaml"
  pull_request:
    paths:
      - "charts/**"
      - "*/apps/**"
      - "*/root/**"
      - ".github/workflows/charts-validate.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: "discover"
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.find.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - id: find
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a PR, render only the apps whose chart or app file changed. On push to main, or when
          # this workflow, an ApplicationSet or the kyverno policies change, render all.
          render_all=0
          declare -A WANT
          if [ "$EVENT" = "pull_request" ]; then
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/charts-validate.yaml|*/root/*|charts/kyverno/*) render_all=1 ;;
                charts/*/*) WANT["$(echo "$f" | cut -d/ -f2)"]=1 ;;
                */apps/*.yaml) WANT["$(basename "$f" .yaml)"]=1 ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" HEAD)
          else
            render_all=1
          fi

          for dir in charts/*/; do
            c=$(basename "$dir")
            compgen -G "*/apps/$c.yaml" > /dev/null || { echo "::error file=$dir::no <site>/apps/$c.yaml deploys this chart"; exit 1; }
          done

          # One entry per site and app, with namespace and release name as the ApplicationSet derives them
          entries=()
          for f in */apps/*.yaml; do
            site=${f%%/*} c=$(basename "$f" .yaml)
            [ -d "charts/$c" ] || { echo "::error file=$f::no chart charts/$c"; exit 1; }
            # Without the directory keys the ApplicationSet renders charts/$c as a Helm chart
            plain=$(yq e '.directory // .directoryRecurse // false' "$f")
            if [ -f "charts/$c/Chart.yaml" ] && [ "$plain" = "true" ]; then
              echo "::error file=$f::charts/$c is a Helm chart, drop directory/directoryRecurse"; exit 1
            elif [ ! -f "charts/$c/Chart.yaml" ] && [ "$plain" != "true" ]; then
              echo "::error file=$f::charts/$c has no Chart.yaml, set directory: true (or directoryRecurse: true)"; exit 1
            fi
            if [ "$render_all" = "0" ] && [ -z "${WANT[$c]:-}" ]; then continue; fi
            ns=$(yq e '.namespace // ""' "$f"); [ -z "$ns" ] && ns="$c"
            release=$(yq e ".name // \"$c\"" "$f")
            entries+=("$(jq -nc --arg n "$c" --arg site "$site" --arg s "$ns" --arg r "$release" '{name:$n, site:$site, ns:$s, release:$r}')")
          done
          if [ ${#entries[@]} -eq 0 ]; then
            charts='[]'
          else
            charts=$(printf '%s\n' "${entries[@]}" | jq -sc '.')
          fi
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "$charts" | jq .

  render:
    name: "render: ${{ matrix.chart.site }}/${{ matrix.chart.name }}"
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.discover.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubeconform
        env:
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION: "v0.8.0"
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Fetch chart dependencies
        run: |
          d="charts/${{ matrix.chart.name }}"
          [ -f "$d/Chart.yaml" ] || { echo "plain manifest dir — no Helm deps"; exit 0; }
          helm dependency build "$d" || helm dependency update "$d"

      - name: Helm lint
        run: |
          d="charts/${{ matrix.chart.name }}"
          [ -f "$d/Chart.yaml" ] || { echo "plain manifest dir — skipping lint"; exit 0; }
          helm lint "$d"

      # Render into the real destination namespace, with the site's values file as the ApplicationSet adds it.
      # Nulls are dropped as the apiserver does before admission.
      - name: Render
        run: |
          d="charts/${{ matrix.chart.name }}"
          site_values=()
          [ -f "$d/values-${{ matrix.chart.site }}.yaml" ] && site_values=(-f "$d/values-${{ matrix.chart.site }}.yaml")
          if [ -f "$d/Chart.yaml" ]; then
            helm template "${{ matrix.chart.release }}" "$d" --namespace "${{ matrix.chart.ns }}" "${site_values[@]}"
          else
            find "$d" -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -exec sh -c 'for f; do cat "$f"; echo; echo "---"; done' _ {} +
          fi \
            | NS="${{ matrix.chart.ns }}" yq eval '
                select(.kind != null)
                | select((.metadata.annotations."helm.sh/hook" // "") | test("test") | not)
                | .metadata.namespace = (.metadata.namespace // strenv(NS))
                | del(.. | select(tag == "!!null"))
              ' - \
            > "rendered-${{ matrix.chart.site }}-${{ matrix.chart.name }}.yaml"

      # -ignore-missing-schemas: own CRDs (e.g. database.lippok.dev)
      - name: Schema validation (kubeconform)
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "rendered-${{ matrix.chart.site }}-${{ matrix.chart.name }}.yaml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-${{ matrix.chart.site }}-${{ matrix.chart.name }}
          path: rendered-${{ matrix.chart.site }}-${{ matrix.chart.name }}.yaml

  kyverno:
    name: "kyverno"
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Kyverno CLI
        env:
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_VERSION: "v1.19.2"
        run: |
          echo "Installing Kyverno CLI ${KYVERNO_VERSION}"
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kyverno

      - name: Download rendered manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rendered-*
          path: rendered
          merge-multiple: true

      - name: Fetch kyverno chart dependencies
        run: helm dependency build charts/kyverno || helm dependency update charts/kyverno

      # Each site's rendered apps (kyverno itself excluded) against the policies + exceptions its cluster
      # enforces at admission. --continue-on-fail so one run reports every violation, not just the first.
      - name: Kyverno apply
        run: |
          status=0
          for app in */apps/kyverno.yaml; do
            site=${app%%/*}
            echo "::group::$site"
            site_values=()
            [ -f "charts/kyverno/values-$site.yaml" ] && site_values=(-f "charts/kyverno/values-$site.yaml")
            helm template kyverno charts/kyverno --namespace kyverno "${site_values[@]}" > "kyverno-$site.yaml"
            yq eval 'select(.kind == "ValidatingPolicy")' "kyverno-$site.yaml" > "policies-$site.yaml"
            yq eval 'select(.kind == "PolicyException" and .apiVersion == "policies.kyverno.io/*")' "kyverno-$site.yaml" > "exceptions-$site.yaml"

            # Kyverno 1.20 no longer executes kyverno.io policy types
            files=("kyverno-$site.yaml")
            for f in rendered/rendered-"$site"-*.yaml; do [ -e "$f" ] && files+=("$f"); done
            legacy=$(yq eval -N 'select(.apiVersion == "kyverno.io/*" and (.kind == "ClusterPolicy" or .kind == "Policy" or .kind == "PolicyException" or .kind == "CleanupPolicy" or .kind == "ClusterCleanupPolicy")) | .kind + "/" + .metadata.name' "${files[@]}")
            if [ -n "$legacy" ]; then
              echo "::error::$site renders kyverno.io policy types that Kyverno no longer executes, migrate them to policies.kyverno.io: $(echo $legacy)"
              status=1
            fi
            echo "Policies:";   grep -c '^kind:' "policies-$site.yaml" || true
            echo "Exceptions:"; grep -c '^kind:' "exceptions-$site.yaml" || true

            : > "resources-$site.yaml"
            for f in rendered/rendered-"$site"-*.yaml; do
              [ -e "$f" ] || continue
              [ "$(basename "$f")" = "rendered-$site-kyverno.yaml" ] && continue
              cat "$f" >> "resources-$site.yaml"
              echo '---' >> "resources-$site.yaml"
            done

            if [ -s "resources-$site.yaml" ]; then
              kyverno apply "policies-$site.yaml" \
                --resource "resources-$site.yaml" \
                --exception "exceptions-$site.yaml" \
                --continue-on-fail || status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
