class="mono s b" text-anchor="middle">*.relay</text><text x="153" y="509.5" class="xs i2" text-anchor="middle">own address</text><path d="M216,498 L570,498" class="ln-vieta" marker-end="url(#ah-vieta)"/><rect x="221.48" y="489" width="73.0397" height="18" rx="9" class="pill"/><text x="258" y="502.32" class="xs b" text-anchor="middle">by address</text><rect x="318" y="80" width="90" height="144" rx="7" class="node-fplnet"/><rect x="314" y="84" width="90" height="144" rx="7" class="node-fplnet"/><rect x="310" y="88" width="90" height="144" rx="7" class="node-fplnet"/><text x="355" y="149" class="s b" text-anchor="middle">HAProxy</text><text x="355" y="164" class="xs i2" text-anchor="middle">TCP 443</text><text x="355" y="179" class="xs i2" text-anchor="middle">reads SNI</text><rect x="428" y="80" width="104" height="92" rx="7" class="node-fplnet"/><rect x="424" y="84" width="104" height="92" rx="7" class="node-fplnet"/><rect x="420" y="88" width="104" height="92" rx="7" class="node-fplnet"/><text x="472" y="123" class="s b" text-anchor="middle">nginx</text><text x="472" y="138" class="xs i2" text-anchor="middle">TLS, static sites</text><text x="472" y="153" class="xs i2" text-anchor="middle">looking glass</text><rect x="428" y="314" width="104" height="40" rx="7" class="node-fplnet"/><rect x="424" y="318" width="104" height="40" rx="7" class="node-fplnet"/><rect x="420" y="322" width="104" height="40" rx="7" class="node-fplnet"/><text x="472" y="338.5" class="s b" text-anchor="middle">nginx</text><text x="472" y="353.5" class="xs i2" text-anchor="middle">HTTP/3, UDP 443</text><rect x="318" y="418" width="214" height="40" rx="7" class="node-fplnet"/><rect x="314" y="422" width="214" height="40" rx="7" class="node-fplnet"/><rect x="310" y="426" width="214" height="40" rx="7" class="node-fplnet"/><text x="417" y="442.5" class="s b" text-anchor="middle">DNAT by port, Tayga SIIT</text><text x="417" y="457.5" class="xs i2" text-anchor="middle">client IPv4 into the edge's :64::/96</text><rect x="572" y="192" width="68" height="326" rx="7" class="node"/><text x="606" y="344" class="s b" text-anchor="middle">WireGuard</text><text x="606" y="359" class="xs i2" text-anchor="middle">tunnels</text><text x="606" y="374" class="xs i2" text-anchor="middle">edge to site</text><rect x="668" y="192" width="82" height="326" rx="7" class="node-vieta"/><text x="709" y="321.5" class="mono xs b" text-anchor="middle">gw1-aah1</text><text x="709" y="336.5" class="mono xs b" text-anchor="middle">gw1-fbg1</text><text x="709" y="351.5" class="xs i2" text-anchor="middle">site gateway</text><text x="709" y="366.5" class="xs i2" text-anchor="middle">port allowlist</text><text x="709" y="381.5" class="xs i2" text-anchor="middle">return via</text><text x="709" y="396.5" class="xs i2" text-anchor="middle">entry edge</text><rect x="764" y="192" width="168" height="326" rx="7" class="node-vieta"/><text x="848" y="214" class="s b" text-anchor="middle">site services</text><rect x="776" y="269" width="144" height="60" rx="7" class="chip-vieta"/><text x="848" y="289" class="s b" text-anchor="middle">Kubernetes</text><text x="848" y="305" class="xs i2" text-anchor="middle">one /128 per Service</text><text x="848" y="320" class="xs i2" text-anchor="middle">via Cilium BGP</text><rect x="776" y="415" width="144" height="60" rx="7" class="chip-vieta"/><text x="848" y="435" class="s b" text-anchor="middle">hosts</text><text x="848" y="451" class="xs i2" text-anchor="middle">own address in</text><text x="848" y="466" class="mono xs i2" text-anchor="middle">f94:20::/64</text><path d="M408,108 L418,108" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><path d="M408,160 L418,160" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><path d="M408,212 L570,212" class="ln-vieta" marker-end="url(#ah-vieta)"/><rect x="422.605" y="203" width="134.791" height="18" rx="9" class="pill"/><text x="490" y="216.32" class="xs i2" text-anchor="middle">unopened, PROXY v2</text><rect x="375.085" y="255" width="109.831" height="18" rx="9" class="pill"/><text x="430" y="268.32" class="xs i2" text-anchor="middle">routed, unopened</text><path d="M532,446 L570,446" class="ln-vieta" marker-end="url(#ah-vieta)"/><rect x="375.085" y="489" width="109.831" height="18" rx="9" class="pill"/><text x="430" y="502.32" class="xs i2" text-anchor="middle">routed, unopened</text><path d="M640,238 L666,238" class="ln-vieta" marker-end="url(#ah-vieta)"/><path d="M750,238 L762,238" class="ln-vieta" marker-end="url(#ah-vieta)"/><path d="M640,472 L666,472" class="ln-vieta" marker-end="url(#ah-vieta)"/><path d="M750,472 L762,472" class="ln-vieta" marker-end="url(#ah-vieta)"/><text x="20" y="566" class="s i2">¹</text><text x="30" y="566" class="s i2">No ECH for site services yet: waiting for a mature ECH split mode, as the edge must decrypt ECH for SNI routing.</text><text x="20" y="584" class="s i2">²</text><text x="30" y="584" class="s i2">No HTTP/3 for site services yet: still looking for a mature router that passes QUIC on by SNI.</text><text x="30" y="602" class="s i2">One that does SNI routing with ECH split mode for both TCP and UDP/QUIC would solve ¹ and ² together.</text></svg>
