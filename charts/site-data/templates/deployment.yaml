apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-data
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: site-data
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: site-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site-data
        app.kubernetes.io/part-of: homelab
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feed
          image: {{ .Values.feed.image }}
          command: ["python3", "-u", "/app/feed.py"]
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
            - name: SITE
              value: {{ .Values.site | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.feed.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/feed.py
              subPath: feed.py
              readOnly: true
        - name: web
          image: {{ .Values.web.image }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: site-data
