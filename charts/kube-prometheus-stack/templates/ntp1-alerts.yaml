apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ntp1-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ntp1
      rules:
        - alert: Ntp1Unreachable
          annotations:
            summary: Prometheus cannot scrape ntp1-aah1.
            description: node_exporter on ntp1-mgmt is down or the CM4 is off (PoE on Flex 2.5G port 5). Every other ntp1 alert is blind until it answers.
          expr: up{job="ntp1-node"} == 0
          for: 5m
          labels:
            severity: warning

        - alert: Ntp1MetricsStale
          annotations:
            summary: "GPSDO metrics on ntp1 are {{`{{ $value | humanizeDuration }}`}} old."
            description: gpsdo.service writes them every 4 s; it has stopped or cannot read the UCCM. See journalctl -u gpsdo.
          expr: time() - gpsdo_last_poll_timestamp_seconds{job="ntp1-node"} > 120
          for: 2m
          labels:
            severity: warning

        - alert: Ntp1NotOnPps
          annotations:
            summary: "chrony on ntp1 is not synchronised to PPS (reference {{`{{ $labels.refid }}`}})."
            description: The PPS refclock is not selected. If the UCCM still has valid 1PPS, ntp1-pps-watchdog re-runs the clock bootstrap after 5 minutes.
          expr: chrony_tracking_info{job="ntp1-node", refid!="PPS"} == 1 or chrony_pps_selected{job="ntp1-node"} == 0
          for: 10m
          labels:
            severity: warning

        - alert: Ntp1NotStratum1
          annotations:
            summary: "ntp1 serves stratum {{`{{ $value }}`}}."
          expr: chrony_tracking_stratum{job="ntp1-node"} != 1
          for: 10m
          labels:
            severity: warning

        - alert: Ntp1ClockOffset
          annotations:
            summary: "ntp1 system clock {{`{{ $value | humanize }}`}}s off PPS."
            description: The offset stays above 1 us. Normal is tens of ns; CPU load on the CM4 shifts its crystal and raises it briefly.
          expr: abs(chrony_tracking_system_offset_seconds{job="ntp1-node"}) > 1e-6
          for: 10m
          labels:
            severity: warning

        - alert: GpsdoNotMaster
          annotations:
            summary: "UCCM status is {{`{{ $labels.status }}`}}."
            description: The UCCM is not in Master, e.g. holdover (lost GPS) or warm-up after power-on.
          expr: gpsdo_status_info{job="ntp1-node", status!="Master"} == 1
          for: 5m
          labels:
            severity: warning

        - alert: GpsdoPpsInvalid
          annotations:
            summary: The UCCM reports its 1PPS as not valid.
          expr: gpsdo_pps_valid{job="ntp1-node"} == 0
          for: 2m
          labels:
            severity: warning

        - alert: GpsdoNotLocked
          annotations:
            summary: "UCCM GPS lock is {{`{{ $labels.state }}`}}."
          expr: gpsdo_lock_info{job="ntp1-node", state!="Locked"} == 1
          for: 10m
          labels:
            severity: warning

        - alert: GpsdoTimeErrorHigh
          annotations:
            summary: "UCCM TFOM has not been below {{`{{ $value }}`}} for 15 minutes."
            description: TFOM is the decade of the UCCM's phase error (0 below 1 ns, 1 for 1-10 ns, 2 for 10-100 ns, 3 for 100 ns-1 us). It normally moves between 0 and 2.
          expr: min_over_time(gpsdo_tfom{job="ntp1-node"}[15m]) >= 3
          labels:
            severity: warning

        - alert: GpsdoAntennaCurrent
          annotations:
            summary: "GPS antenna draws {{`{{ $value }}`}} mA."
            description: The puck draws about 10.8 mA. Below 5 mA the cable or antenna is open, above 40 mA it is shorted.
          expr: gpsdo_antenna_milliamps{job="ntp1-node"} < 5 or gpsdo_antenna_milliamps{job="ntp1-node"} > 40
          for: 5m
          labels:
            severity: warning

        - alert: GpsdoPositionNotFixed
          annotations:
            summary: "UCCM position mode is {{`{{ $labels.mode }}`}}."
            description: The UCCM left its stored surveyed position; neither a reset nor a power cycle does that, only a factory reset or a survey.
          expr: gpsdo_position_mode_info{job="ntp1-node", mode!="fixed"} == 1
          for: 10m
          labels:
            severity: warning

        - alert: GpsdoHoldoverLong
          annotations:
            summary: "UCCM in holdover for {{`{{ $value | humanizeDuration }}`}}."
            description: The OCXO has run without GPS for over an hour. Check the antenna (current, cable) and the sky view.
          expr: gpsdo_holdover_seconds{job="ntp1-node"} > 3600 and on() gpsdo_status_info{job="ntp1-node", status=~".*Holdover.*"} == 1
          labels:
            severity: warning

        - alert: Ntp1ServerStatsStale
          annotations:
            summary: chrony server statistics on ntp1 are missing or stale.
            description: ntp1-chrony-stats.service writes them every 15 s as _chrony; it has stopped or chronyc fails. See journalctl -u ntp1-chrony-stats.
          expr: time() - chrony_stats_last_run_timestamp_seconds{job="ntp1-node"} > 120 or chrony_stats_up{job="ntp1-node"} == 0
          for: 5m
          labels:
            severity: warning

        - alert: Ntp1NoHardwareTimestamps
          annotations:
            summary: "Only {{`{{ $value | humanizePercentage }}`}} of NTP requests on ntp1 got an i210 hardware RX timestamp."
            description: Normally every request after chrony's first few gets one. Kernel timestamps mean chrony lost the i210 PHC on ntp0 (hwtimestamp) and serves with microsecond rather than nanosecond accuracy.
          expr: |
            increase(chrony_server_rx_timestamps_total{job="ntp1-node", source="hardware"}[30m])
              / increase(chrony_server_ntp_packets_received_total{job="ntp1-node"}[30m]) < 0.9
            and increase(chrony_server_ntp_packets_received_total{job="ntp1-node"}[30m]) > 20
          for: 15m
          labels:
            severity: warning

        - alert: Ntp1SiteClientDropped
          annotations:
            summary: "chrony on ntp1 dropped {{`{{ $value | humanize }}`}} requests from {{`{{ $labels.name }}`}} ({{`{{ $labels.client }}`}}) in 15 minutes."
            description: chrony rate limits a client that sends more than a burst of 16 and then one request every 2 s (ratelimit interval 1 burst 16). A site client doing that polls far too often, for example a minpoll below 1 or two time daemons on one host.
          expr: increase(chrony_client_ntp_dropped_total{job="ntp1-node"}[15m]) > 0
          labels:
            severity: warning

        - alert: Ntp1PublicRequestsDropped
          annotations:
            summary: "chrony on ntp1 dropped {{`{{ $value | humanizePercentage }}`}} of public NTP requests over 30 minutes."
            description: Rate limiting of single broken pool clients drops about 1 percent of public requests, at most 16 percent in a 30 minute window (7 days to 2026-11-26). A quarter or more is a flood from many addresses or far more pool load than ntp1 is set up for; single busy clients are in chrony_top_client_requests_per_minute.
          expr: |
            increase(chrony_other_clients_ntp_dropped_total{job="ntp1-node"}[30m])
              / increase(chrony_other_clients_ntp_packets_total{job="ntp1-node"}[30m]) > 0.25
            and increase(chrony_other_clients_ntp_packets_total{job="ntp1-node"}[30m]) > 500
          for: 30m
          labels:
            severity: warning

        - alert: Ntp1ClientFlooding
          annotations:
            summary: "{{`{{ $labels.client }}`}} ({{`{{ $labels.scope }}`}}) sends ntp1 {{`{{ $value }}`}} requests per minute."
            description: A normal client asks every 64 to 1024 s and sends a short burst only at start (iburst); 12 a minute for 10 minutes is a broken or abusive client. Block it in nftables on ntp1 if it does not stop.
          expr: chrony_top_client_requests_per_minute{job="ntp1-node"} > 12
          for: 10m
          labels:
            severity: warning

        - alert: Ntp1ClientSilent
          annotations:
            summary: "{{`{{ $labels.name }}`}} ({{`{{ $labels.client }}`}}) has not asked ntp1 for the time in {{`{{ $value | humanizeDuration }}`}}."
            description: An inventory host that polled ntp1 before has missed four of its own polling intervals and at least an hour. It is down, or it no longer uses ntp1.
          expr: |
            (time() - chrony_client_last_request_timestamp_seconds{job="ntp1-node", name!=""})
              > 4 * clamp_min(chrony_client_request_interval_seconds{job="ntp1-node", name!=""}, 64)
            and (time() - chrony_client_last_request_timestamp_seconds{job="ntp1-node", name!=""}) > 3600
          labels:
            severity: warning
