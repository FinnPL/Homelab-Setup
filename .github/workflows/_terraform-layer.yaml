name: "Terraform: layer"

# Reusable building block for the four Vieta layers (00-global..03-services).
# Called only via workflow_call from vieta-deploy.yaml.

on:
  workflow_call:
    inputs:
      layer:
        description: "Layer directory name (e.g. 01-network)"
        required: true
        type: string
      init_upgrade:
        description: "Pass -upgrade to terraform init"
        type: boolean
        default: false
      needs_homelab:
        description: "Reach the homelab (Tailscale + Node + unzip)"
        type: boolean
        default: false
      needs_ansible:
        description: "Install Ansible (provisioners)"
        type: boolean
        default: false
      apply:
        description: "Apply on manual dispatch (push-to-main applies regardless)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    name: "${{ inputs.layer }}"
    runs-on: ubuntu-latest
    environment: vieta
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('terraform-{0}-pr-{1}', inputs.layer, github.event.pull_request.number) || format('terraform-{0}', inputs.layer) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ./${{ inputs.layer }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_unifi_api_url: ${{ vars.UNIFI_API_URL }}
      TF_VAR_unifi_insecure: ${{ vars.UNIFI_INSECURE }}
      TF_VAR_proxmox_ssh_user: ${{ vars.PROXMOX_SSH_USER }}
      TF_VAR_proxmox_insecure: ${{ vars.PROXMOX_INSECURE }}
      TF_VAR_proxmox_node: ${{ vars.PROXMOX_NODE }}
      TF_VAR_proxmox_ssh_public_key: ${{ vars.PROXMOX_SSH_PUB_KEY }}
      TF_VAR_cluster_name: ${{ vars.TALOS_CLUSTER_NAME }}
      TF_VAR_mesh_wg_peer_pubkey: ${{ vars.CLOUD_WG_PUBKEY }}
      TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: vieta-layers
          jwtGithubAudience: https://vault.cloud.lippok.dev
          secrets: |
            kv/data/cloudflare api-token | TF_VAR_cloudflare_api_token ;
            kv/data/vieta/unifi api-key | TF_VAR_unifi_api_key ;
            kv/data/vieta/proxmox api-token | TF_VAR_proxmox_api_token ;
            kv/data/vieta/proxmox ssh-password | TF_VAR_proxmox_ssh_password ;
            kv/data/vieta/nfs root-password | TF_VAR_nfs_root_password ;
            kv/data/vieta/postgres root-password | TF_VAR_postgres_root_password ;
            kv/data/vieta/postgres admin-password | TF_VAR_postgres_admin_password ;
            kv/data/vieta/mesh-router root-password | TF_VAR_mesh_router_root_password ;
            kv/data/vieta/mesh-router wg-private-key | TF_VAR_mesh_wg_private_key ;
            kv/data/ci/tailscale oauth-client-id | TS_OAUTH_CLIENT_ID ;
            kv/data/ci/tailscale oauth-secret | TS_OAUTH_SECRET

      - name: Tailscale
        if: inputs.needs_homelab
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Node.js
        if: inputs.needs_homelab
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install Dependencies
        if: inputs.needs_homelab
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install Ansible
        if: inputs.needs_ansible
        run: pip install ansible

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: vieta-layers
          export-token: ${{ inputs.needs_ansible }}

      # Throwaway keypair signed by the Vault user CA the LXCs trust.
      - name: Mint Ansible SSH certificate
        if: inputs.needs_ansible
        working-directory: ${{ runner.temp }}
        run: |
          ssh-keygen -q -t ed25519 -N "" -C "gha-${GITHUB_RUN_ID}" -f ansible_key
          signed=$(jq -n --rawfile pk ansible_key.pub '{public_key: $pk}' \
            | curl -sS -f -X PUT \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                --data-binary @- \
                https://vault.cloud.lippok.dev/v1/ssh-client-signer/sign/homelab \
            | jq -r '.data.signed_key')
          if [ -z "$signed" ] || [ "$signed" = "null" ]; then
            echo "::error::Vault did not return a signed certificate"
            exit 1
          fi
          printf '%s\n' "$signed" > ansible_key-cert.pub
          ssh-keygen -Lf ansible_key-cert.pub | grep -E 'Key ID|Valid:'
          echo "TF_VAR_ansible_ssh_key_file=${{ runner.temp }}/ansible_key" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init ${{ inputs.init_upgrade && '-upgrade' || '' }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -lock-timeout=10m -out .planfile -input=false
        continue-on-error: true # capture plan failure for the PR comment

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@2d41e908725447b1677913001dfb92fa7010c025 # v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: .planfile
          working-directory: ./${{ inputs.layer }}
          header: "Terraform Plan (${{ inputs.layer }})"

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: terraform apply -lock-timeout=10m -auto-approve -input=false
