name: "Minerva: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "minerva/**"
      - ".github/workflows/minerva-deploy.yaml"

concurrency:
  group: minerva-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: pi3
    environment: minerva
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Mint minerva tailnet key
        id: ts_authkey
        uses: ./.github/actions/tailscale-authkey
        with:
          client-id: ${{ vars.TAILSCALE_MINERVA_CLIENT_ID }}
          tags: tag:minerva
          description: "minerva join key"
          expiry-seconds: "1800"

      - name: Clear Env File
        run: echo "" > minerva/.env

      - name: Set up Env File
        env:
          TAILSCALE_AUTHKEY: ${{ steps.ts_authkey.outputs.authkey }}
        run: |
          echo "TAILSCALE_AUTHKEY=${TAILSCALE_AUTHKEY}" >> minerva/.env

      - name: Pull latest images
        run: docker compose --env-file minerva/.env -f minerva/docker-compose.yml pull

      - name: Stop existing containers
        run: docker compose --env-file minerva/.env -f minerva/docker-compose.yml down || true

      - name: Start containers
        run: docker compose --env-file minerva/.env -f minerva/docker-compose.yml up -d
