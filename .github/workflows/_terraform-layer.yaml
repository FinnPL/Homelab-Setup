name: "Terraform: layer"

# Reusable building block for the four Vieta layers (00-global..03-services).
# Called only via workflow_call from vieta-deploy.yaml.

on:
  workflow_call:
    inputs:
      layer:
        description: "Layer directory name (e.g. 01-network)"
        required: true
        type: string
      needs_homelab:
        description: "Reach the homelab (Tailscale + Node + unzip)"
        type: boolean
        default: false
      needs_ansible:
        description: "Install Ansible (provisioners)"
        type: boolean
        default: false
      apply:
        description: "Apply on manual dispatch (push-to-main applies regardless)"
        type: boolean
        default: false
      needs_cluster_cert:
        description: "Authenticate to the Kubernetes API with a Vault pki-k8s certificate"
        type: boolean
        default: false
      upgrade_cluster:
        description: "Before an apply, upgrade the running nodes to talos-versions.yaml"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    name: "${{ inputs.layer }}"
    runs-on: ubuntu-latest
    environment: vieta
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('terraform-{0}-pr-{1}', inputs.layer, github.event.pull_request.number) || format('terraform-{0}', inputs.layer) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ./${{ inputs.layer }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      UPGRADE_CLUSTER: >-
        ${{ inputs.upgrade_cluster && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.apply)) }}
      TF_VAR_unifi_api_url: ${{ vars.UNIFI_API_URL }}
      TF_VAR_unifi_insecure: ${{ vars.UNIFI_INSECURE }}
      TF_VAR_proxmox_ssh_user: ${{ vars.PROXMOX_SSH_USER }}
      TF_VAR_proxmox_insecure: ${{ vars.PROXMOX_INSECURE }}
      TF_VAR_proxmox_node: ${{ vars.PROXMOX_NODE }}
      TF_VAR_cluster_name: ${{ vars.TALOS_CLUSTER_NAME }}
      TF_VAR_mesh_wg_peer_pubkey: ${{ vars.CLOUD_WG_PUBKEY }}
      TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: ${{ github.ref == 'refs/heads/main' && 'vieta-layers' || 'vieta-layers-plan' }}
          jwtGithubAudience: https://vault.cloud.lippok.dev
          secrets: |
            kv/data/cloudflare api-token | TF_VAR_cloudflare_api_token ;
            kv/data/vieta/unifi api-key | TF_VAR_unifi_api_key ;
            kv/data/vieta/proxmox ssh-password | TF_VAR_proxmox_ssh_password ;
            kv/data/vieta/nfs root-password | TF_VAR_nfs_root_password ;
            kv/data/vieta/mesh-router root-password | TF_VAR_mesh_router_root_password ;
            kv/data/vieta/mesh-router wg-private-key | TF_VAR_mesh_wg_private_key

      - name: Tailscale
        if: inputs.needs_homelab
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CI_CLIENT_ID }}
          audience: api.tailscale.com/${{ vars.TAILSCALE_CI_CLIENT_ID }}
          tags: tag:ci

      - name: Setup Node.js
        if: inputs.needs_homelab
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Dependencies
        if: inputs.needs_homelab
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install Ansible
        if: inputs.needs_ansible
        env:
          # renovate: datasource=pypi depName=ansible
          ANSIBLE_VERSION: "14.5.0"
        run: pip install "ansible==${ANSIBLE_VERSION}"

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: ${{ github.ref == 'refs/heads/main' && 'vieta-layers' || 'vieta-layers-plan' }}
          export-token: ${{ inputs.needs_ansible || inputs.needs_cluster_cert || inputs.upgrade_cluster }}

      # The Talos admin kubeconfig in 02's state stays as break-glass.
      # Each role can only issue its own: admin under vieta-layers, reader under vieta-layers-plan.
      - name: Mint Kubernetes client certificate
        if: inputs.needs_cluster_cert
        uses: ./.github/actions/vault-cluster-client-cert
        with:
          api: k8s
          role: ${{ github.ref == 'refs/heads/main' && 'admin' || 'reader' }}

      - name: Mint Talos client certificate for the upgrade
        if: env.UPGRADE_CLUSTER == 'true'
        uses: ./.github/actions/vault-cluster-client-cert
        with:
          api: talos
          role: admin
          ttl: 4h
          out-dir: ${{ runner.temp }}/cluster-certs

      - name: Mint Kubernetes client certificate for the upgrade
        if: env.UPGRADE_CLUSTER == 'true'
        uses: ./.github/actions/vault-cluster-client-cert
        with:
          api: k8s
          role: admin
          ttl: 4h
          out-dir: ${{ runner.temp }}/cluster-certs

      # Throwaway keypair signed by the Vault user CA the LXCs trust.
      # Only the main-bound role may sign
      - name: Mint Ansible SSH certificate
        if: inputs.needs_ansible && github.ref == 'refs/heads/main'
        uses: ./.github/actions/vault-ssh-client-cert
        with:
          role: homelab
          key-path: ${{ runner.temp }}/vault_ssh_key
          host-ca-file: 02-infrastructure/ansible/files/vault_host_ca.pub
          host-patterns: "10.10.1.*,*.athena"

      - name: Pin the Proxmox host key
        if: inputs.needs_homelab
        run: |
          mkdir -p ~/.ssh
          cat "${GITHUB_WORKSPACE}/02-infrastructure/ansible/files/proxmox_known_hosts" >> ~/.ssh/known_hosts

      - name: Hand the certificate to the Ansible provisioners
        if: inputs.needs_ansible
        run: echo "TF_VAR_ansible_ssh_key_file=${RUNNER_TEMP}/vault_ssh_key" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Upgrade Talos and Kubernetes
        if: env.UPGRADE_CLUSTER == 'true'
        timeout-minutes: 150
        run: |
          set -euo pipefail
          if ! terraform output -json | jq -e 'has("talosconfig")' > /dev/null; then
            echo "No cluster in state yet; nothing to upgrade."
            exit 0
          fi

          # Endpoints and server CAs from state, credentials from Vault.
          certs="$RUNNER_TEMP/cluster-certs"
          export TALOSCONFIG="$RUNNER_TEMP/talosconfig" KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          umask 077
          terraform output -raw talosconfig |
            CRT=$(base64 -w0 "$certs/talos.crt") KEY=$(base64 -w0 "$certs/talos.key") \
              yq '.contexts[].crt = strenv(CRT) | .contexts[].key = strenv(KEY)' > "$TALOSCONFIG"
          terraform output -raw kubeconfig |
            CRT=$(base64 -w0 "$certs/k8s.crt") KEY=$(base64 -w0 "$certs/k8s.key") \
              yq '.users[].user."client-certificate-data" = strenv(CRT) | .users[].user."client-key-data" = strenv(KEY)' > "$KUBECONFIG"

          release="https://github.com/siderolabs/talos/releases/download/$(yq -r '.talos' talos-versions.yaml)"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/talosctl" "$release/talosctl-linux-amd64"
          sum=$(curl -fsSL "$release/sha256sum.txt" | awk '$2 == "talosctl-linux-amd64" { print $1 }')
          echo "$sum  $RUNNER_TEMP/bin/talosctl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/talosctl"

          PATH="$RUNNER_TEMP/bin:$PATH" ./scripts/talos-upgrade.sh talos-versions.yaml

      - name: Terraform Plan
        id: plan
        run: terraform plan -lock-timeout=10m -out .planfile -input=false
        continue-on-error: true # capture plan failure for the PR comment

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/terraform-plan-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./${{ inputs.layer }}
          header: "Terraform Plan (${{ inputs.layer }})"

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.apply))
        run: terraform apply -lock-timeout=10m -auto-approve -input=false .planfile
