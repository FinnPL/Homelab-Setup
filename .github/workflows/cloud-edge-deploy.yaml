name: "Cloud Edge: deploy"

on:
  pull_request:
    paths:
      - "cloud-edge/**"
      - ".github/workflows/cloud-edge-deploy.yaml"
  push:
    branches: [main]
    paths:
      - "cloud-edge/**"
      - ".github/workflows/cloud-edge-deploy.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply"
        type: boolean
        default: false
      deploy_nixos:
        description: "Run nixos-rebuild (config update)"
        type: boolean
        default: false
      activation_mode:
        description: "How to activate: switch (live), or boot to stage it and reboot (for changes that trip switch inhibitors)"
        type: choice
        options:
          - switch
          - boot
        default: switch
      force_install_nixos:
        description: "Force nixos-anywhere install (manual, bypasses fresh-VM proof)"
        type: boolean
        default: false
      allow_host_tofu:
        description: "Accept the edge host key without a Vault host certificate (recovery / first adoption)"
        type: boolean
        default: false
      instance_availability_domain:
        description: "Optional OCI availability domain override (example: kIdk:EU-FRANKFURT-1-AD-2)"
        type: string
        default: ""
      replace_target:
        description: "Optional Terraform resource address to force-replace on apply. Only honored when apply=true."
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  id-token: write

# Terraform: provisions OCI infrastructure + Cloudflare DNS
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      nixos: ${{ steps.filter.outputs.nixos }}
      workflow_logic: ${{ steps.filter.outputs.workflow_logic }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            terraform:
              - 'cloud-edge/**/*.tf'
              - 'cloud-edge/.terraform.lock.hcl'
            nixos:
              - 'cloud-edge/nixos/**'
            workflow_logic:
              - '.github/workflows/cloud-edge-deploy.yaml'
              - 'cloud-edge/scripts/gha/**'

  terraform:
    needs: changes
    if: |
      needs.changes.outputs.terraform == 'true' ||
      github.event_name == 'workflow_dispatch'
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: cloud-edge
    outputs:
      instance_action: ${{ steps.edge_plan.outputs.instance_action }}
      instance_new: ${{ steps.edge_plan.outputs.instance_new }}
    concurrency:
      group: terraform-cloud-edge
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./cloud-edge
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_oci_region: ${{ vars.OCI_REGION }}
      TF_VAR_ssh_public_key: ${{ vars.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_instance_availability_domain: ${{ github.event_name == 'workflow_dispatch' && inputs.instance_availability_domain || '' }}
      REPLACE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_target || '' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: cloud-edge
          jwtGithubAudience: https://vault.cloud.lippok.dev
          secrets: |
            kv/data/cloud-edge/oci tenancy-ocid | TF_VAR_oci_tenancy_ocid ;
            kv/data/cloud-edge/oci user-ocid | TF_VAR_oci_user_ocid ;
            kv/data/cloud-edge/oci fingerprint | TF_VAR_oci_fingerprint ;
            kv/data/cloud-edge/oci private-key | TF_VAR_oci_private_key ;
            kv/data/cloud-edge/oci compartment-ocid | TF_VAR_oci_compartment_ocid ;
            kv/data/cloudflare api-token | TF_VAR_cloudflare_api_token

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: cloud-edge

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          extra_args=()
          if [ -n "${REPLACE_TARGET:-}" ]; then
            echo "::notice::Planning with -replace=${REPLACE_TARGET}"
            extra_args+=(-replace="${REPLACE_TARGET}")
          fi
          terraform plan -lock-timeout=10m -out .planfile -input=false "${extra_args[@]}"
        continue-on-error: true

      - name: Detect edge instance lifecycle action
        id: edge_plan
        if: steps.plan.outcome == 'success'
        run: bash ./scripts/gha/cloud-edge-workflow.sh detect-instance-action

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@2d41e908725447b1677913001dfb92fa7010c025 # v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: .planfile
          working-directory: ./cloud-edge
          header: "Terraform Plan (cloud-edge)"

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          EDGE_INSTANCE_NEW: ${{ steps.edge_plan.outputs.instance_new }}
        run: |
          if [ "${EDGE_INSTANCE_NEW:-false}" = "true" ]; then
            # Re-plans per availability domain: a saved plan cannot take -var.
            bash ./scripts/gha/cloud-edge-workflow.sh terraform-apply-with-ad-fallback
          else
            terraform apply -lock-timeout=10m -auto-approve -input=false .planfile
          fi

  validate-nixos:
    needs: changes
    if: |
      needs.changes.outputs.nixos == 'true' ||
      needs.changes.outputs.terraform == 'true' ||
      needs.changes.outputs.workflow_logic == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.apply || inputs.deploy_nixos || inputs.force_install_nixos))
    name: "Validate NixOS"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate workflow helper script syntax
        run: bash -n ./cloud-edge/scripts/gha/cloud-edge-workflow.sh

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: alejandra (format check)
        working-directory: cloud-edge/nixos
        run: nix run nixpkgs#alejandra -- --check .

      - name: statix (lint)
        working-directory: cloud-edge/nixos
        run: nix run nixpkgs#statix -- check .

      - name: deadnix (dead code)
        working-directory: cloud-edge/nixos
        run: nix run nixpkgs#deadnix -- --fail .

      - name: Validate Nix flake
        run: nix flake show ./cloud-edge/nixos --no-write-lock-file >/dev/null

      - name: Evaluate oracle-edge configuration
        run: |
          nix eval ./cloud-edge/nixos#nixosConfigurations.oracle-edge.config.system.build.toplevel.drvPath \
            --raw \
            --no-write-lock-file \
            >/dev/null

  # NixOS Deploy: installs or updates NixOS on the edge node
  deploy-nixos:
    needs: [changes, terraform, validate-nixos]
    if: |
      always() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (needs['validate-nixos'].result == 'success' || needs['validate-nixos'].result == 'skipped') &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (
            needs.changes.outputs.nixos == 'true' ||
            needs.terraform.outputs.instance_new == 'true'
          )
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.deploy_nixos ||
            (inputs.apply && needs.terraform.outputs.instance_new == 'true') ||
            inputs.force_install_nixos
          )
        )
      )
    name: "NixOS Deploy"
    runs-on: ubuntu-latest
    environment: cloud-edge
    concurrency:
      group: nixos-cloud-edge
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.cloud.lippok.dev
          method: jwt
          path: github-actions
          role: cloud-edge
          jwtGithubAudience: https://vault.cloud.lippok.dev
          secrets: |
            kv/data/cloud-edge/wg private-key | WG_PRIVATE_KEY ;
            kv/data/cloud-edge/wg mesh-peer-pubkey | WG_PEER_PUBKEY ;
            kv/data/cloud-edge/myip cloudflare-api | MYIP_CLOUDFLARE_API ;
            kv/data/cloud-edge/maxmind account-id | MAXMIND_ACCOUNT_ID ;
            kv/data/cloud-edge/maxmind license-key | MAXMIND_LICENSE_KEY ;
            kv/data/cloudflare api-token | CLOUDFLARE_API_TOKEN ;
            kv/data/apps/tailscale oauth-secret | TAILSCALE_OAUTH_SECRET

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          vault-role: cloud-edge
          export-token: true

      - name: Validate dispatch mode
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.apply }}" = "true" ] && [ "${{ inputs.deploy_nixos }}" = "true" ]; then
            echo "::error::Choose only one mode for manual runs: apply or deploy_nixos"
            exit 1
          fi

          if [ "${{ inputs.apply }}" = "true" ] && [ "${{ inputs.force_install_nixos }}" = "true" ]; then
            echo "::error::Choose only one install mode: apply or force_install_nixos"
            exit 1
          fi

          if [ "${{ inputs.deploy_nixos }}" = "true" ] && [ "${{ inputs.force_install_nixos }}" = "true" ]; then
            echo "::error::Choose only one NixOS mode: deploy_nixos or force_install_nixos"
            exit 1
          fi

      - name: Mint edge SSH certificate
        uses: ./.github/actions/vault-ssh-client-cert
        with:
          role: oci-edge
          key-path: "~/.ssh/edge_key"

      - name: Prepare edge host context
        id: edge
        working-directory: ./cloud-edge
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          # A fresh VM cannot hold a certificate yet
          ALLOW_HOST_TOFU: ${{ needs.terraform.outputs.instance_new == 'true' || inputs.allow_host_tofu }}
        run: bash ./scripts/gha/cloud-edge-workflow.sh prepare-edge-host

      - name: Resolve run mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          APPLY: ${{ inputs.apply }}
          DEPLOY_NIXOS: ${{ inputs.deploy_nixos }}
          FORCE_INSTALL: ${{ inputs.force_install_nixos }}
          NIXOS_CHANGED: ${{ needs.changes.outputs.nixos }}
          INSTANCE_NEW: ${{ needs.terraform.outputs.instance_new }}
          NIXOS_STATE: ${{ steps.edge.outputs.nixos_state }}
        run: |
          set -uo pipefail

          push_main=false
          [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] && push_main=true

          apply=false; deploy_in=false; force=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$APPLY" = "true" ] && apply=true
            [ "$DEPLOY_NIXOS" = "true" ] && deploy_in=true
            [ "$FORCE_INSTALL" = "true" ] && force=true
          fi

          new=false
          [ "$INSTANCE_NEW" = "true" ] && new=true

          applypush_new=false
          { [ "$push_main" = true ] || [ "$apply" = true ]; } && [ "$new" = true ] && applypush_new=true

          install_requested=false
          { [ "$applypush_new" = true ] || [ "$force" = true ]; } && install_requested=true

          do_install=false
          { [ "$applypush_new" = true ] && [ "$NIXOS_STATE" = "absent" ]; } && do_install=true
          { [ "$force" = true ] && [ "$NIXOS_STATE" != "installed" ]; } && do_install=true

          deploy_requested=false
          { [ "$NIXOS_CHANGED" = "true" ] && [ "$REF" = "refs/heads/main" ] && [ "$new" = false ]; } && deploy_requested=true
          [ "$deploy_in" = true ] && deploy_requested=true

          {
            echo "applypush_new=$applypush_new"
            echo "install_requested=$install_requested"
            echo "do_install=$do_install"
            echo "deploy_requested=$deploy_requested"
          } >> "$GITHUB_OUTPUT"
          echo "mode: applypush_new=$applypush_new install_requested=$install_requested do_install=$do_install deploy_requested=$deploy_requested (state=$NIXOS_STATE new=$new)"

      - name: Write SSH keys for NixOS
        env:
          OCI_SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh write-ssh-keys-nix

      - name: Write ACME email for NixOS
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh write-acme-email-nix

      # First-time install (nixos-anywhere) when Terraform proved a new VM
      - name: Guard install when target already has NixOS
        if: steps.mode.outputs.install_requested == 'true' && steps.edge.outputs.nixos_state == 'installed'
        run: |
          echo "::error::Terraform reported a new VM, but target already reports NixOS installed."
          echo "::error::Aborting to avoid acting on the wrong host."
          exit 1

      - name: Guard install when target state is unknown
        if: steps.mode.outputs.applypush_new == 'true' && steps.edge.outputs.nixos_state == 'unknown'
        run: |
          echo "::error::Terraform reported a new VM, but SSH state verification is unknown."
          echo "::error::Fix SSH/host reachability and rerun."
          exit 1

      - name: "Install NixOS On New VM"
        if: steps.mode.outputs.do_install == 'true'
        run: |
          echo "Running nixos-anywhere on ${{ steps.edge.outputs.ip }}..."
          # renovate: datasource=github-tags depName=nix-community/nixos-anywhere versioning=semver
          nix run github:nix-community/nixos-anywhere/1.13.0 -- \
            --flake ./cloud-edge/nixos#oracle-edge \
            --build-on-remote \
            -i ~/.ssh/edge_key \
            root@${{ steps.edge.outputs.ip }}

      - name: Guard deploy when NixOS is missing
        if: steps.mode.outputs.deploy_requested == 'true' && steps.edge.outputs.nixos_state != 'installed'
        run: |
          if [ "${{ steps.edge.outputs.nixos_state }}" = "unknown" ]; then
            echo "::error::deploy_nixos path selected, but target state is unknown (SSH verification failed)."
            echo "::error::Fix SSH/host reachability first, then rerun deploy_nixos."
          else
            echo "::error::deploy_nixos path selected, but NixOS was not detected on target."
          fi
          exit 1

      # The install might be long enough to outlive the 1h client certificate.
      - name: Re-mint edge SSH certificate
        if: steps.mode.outputs.do_install == 'true'
        uses: ./.github/actions/vault-ssh-client-cert
        with:
          role: oci-edge
          key-path: "~/.ssh/edge_key"

      - name: Refresh SSH after NixOS install
        if: steps.mode.outputs.do_install == 'true'
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh refresh-ssh-after-install

      # Tailscale auth key
      - name: Deploy Tailscale credentials
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh deploy-tailscale-credentials

      # WireGuard keys for the homelab tunnel (wg0)
      - name: Deploy WireGuard keys
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh deploy-wireguard-keys

      # Cloudflare API token for acme DNS-01 wildcard cert
      - name: Deploy Cloudflare credentials
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh deploy-cloudflare-credentials

      - name: Deploy MyIP secrets
        env:
          IP: ${{ steps.edge.outputs.ip }}
          MAXMIND_AUTO_UPDATE: ${{ vars.MAXMIND_AUTO_UPDATE }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh deploy-myip-secrets

      # Config update (nixos-rebuild)
      - name: "Update NixOS (nixos-rebuild)"
        if: steps.mode.outputs.deploy_requested == 'true'
        env:
          IP: ${{ steps.edge.outputs.ip }}
          ACTIVATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.activation_mode || 'switch' }}
        run: |
          echo "Deploying NixOS config to $IP via nixos-rebuild remote mode ($ACTIVATION_MODE)..."

          # Keep deploy transport explicit and strict for all SSH calls done by nixos-rebuild.
          export NIX_SSHOPTS="-i ~/.ssh/edge_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          NIXPKGS_REV="$(jq -er '.nodes.nixpkgs.locked.rev' ./cloud-edge/nixos/flake.lock)"

          nix run "github:NixOS/nixpkgs/${NIXPKGS_REV}#nixos-rebuild" -- \
            "$ACTIVATION_MODE" \
            --flake ./cloud-edge/nixos#oracle-edge \
            --build-host "root@$IP" \
            --target-host "root@$IP" \
            --fast

      # boot only stages the generation; nothing is live until the host restarts.
      - name: "Reboot into the staged generation"
        if: |
          steps.mode.outputs.deploy_requested == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.activation_mode == 'boot'
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh reboot-edge

      - name: Wait for Tailscale to connect
        id: tailscale
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh wait-for-tailscale

      - name: Wait for WireGuard tunnel
        env:
          IP: ${{ steps.edge.outputs.ip }}
        run: bash ./cloud-edge/scripts/gha/cloud-edge-workflow.sh wait-for-wireguard
