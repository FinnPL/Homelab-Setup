<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 622" width="960" height="622" role="img"><title>How requests reach the edges and the sites: TCP or UDP, edge or site, IPv4 or IPv6</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13.5px;fill:#1f2328}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}.xs{font-size:11px}.s{font-size:12px}.l{font-size:15.5px}.xl{font-size:17px}.up{letter-spacing:.08em}.i2{fill:#59636e}.i3{fill:#818b98}.node{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}.chip{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}.panel{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}.pill{fill:#ffffff}.ln{fill:none;stroke:#818b98;stroke-width:1.4}.mk{fill:#818b98}.dash{stroke-dasharray:5 4}.thick{stroke-width:2.2}.lead{fill:none;stroke:#d1d9e0;stroke-width:1;stroke-dasharray:2 4}.tree{fill:none;stroke:#818b98;stroke-width:1.2}.ghost{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:5 4}.t-fplnet{fill:#2f5597}.panel-fplnet{fill:#eef3fb;stroke:#2f5597;stroke-opacity:.45;stroke-width:1}.node-fplnet{fill:#ffffff;stroke:#2f5597;stroke-width:1.3}.chip-fplnet{fill:#eef3fb;stroke:#2f5597;stroke-opacity:.6;stroke-width:1}.pill-fplnet{fill:#eef3fb}.ln-fplnet{fill:none;stroke:#2f5597;stroke-width:1.6}.mk-fplnet{fill:#2f5597}.dot-fplnet{fill:#2f5597}.t-vieta{fill:#2c7a4b}.panel-vieta{fill:#edf6f0;stroke:#2c7a4b;stroke-opacity:.45;stroke-width:1}.node-vieta{fill:#ffffff;stroke:#2c7a4b;stroke-width:1.3}.chip-vieta{fill:#edf6f0;stroke:#2c7a4b;stroke-opacity:.6;stroke-width:1}.pill-vieta{fill:#edf6f0}.ln-vieta{fill:none;stroke:#2c7a4b;stroke-width:1.6}.mk-vieta{fill:#2c7a4b}.dot-vieta{fill:#2c7a4b}.t-minerva{fill:#7b4fae}.panel-minerva{fill:#f5f0fa;stroke:#7b4fae;stroke-opacity:.45;stroke-width:1}.node-minerva{fill:#ffffff;stroke:#7b4fae;stroke-width:1.3}.chip-minerva{fill:#f5f0fa;stroke:#7b4fae;stroke-opacity:.6;stroke-width:1}.pill-minerva{fill:#f5f0fa}.ln-minerva{fill:none;stroke:#7b4fae;stroke-width:1.6}.mk-minerva{fill:#7b4fae}.dot-minerva{fill:#7b4fae}.t-vault{fill:#9a6700}.panel-vault{fill:#fdf6e3;stroke:#9a6700;stroke-opacity:.45;stroke-width:1}.node-vault{fill:#ffffff;stroke:#9a6700;stroke-width:1.3}.chip-vault{fill:#fdf6e3;stroke:#9a6700;stroke-opacity:.6;stroke-width:1}.pill-vault{fill:#fdf6e3}.ln-vault{fill:none;stroke:#9a6700;stroke-width:1.6}.mk-vault{fill:#9a6700}.dot-vault{fill:#9a6700}</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="ah-fplnet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-fplnet"/></marker><marker id="ah-vieta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-vieta"/></marker><marker id="ah-minerva" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-minerva"/></marker><marker id="ah-vault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-vault"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><text x="20" y="40" class="xs b up i3">INTERNET</text><rect x="298" y="16" width="258" height="524" rx="12" class="panel-fplnet"/><text x="312" y="40" xml:space="preserve"><tspan class="xs b up t-fplnet">EDGES</tspan><tspan class="mono xs i2">   ams1, dus1, fra1</tspan></text><rect x="564" y="16" width="84" height="524" rx="12" class="panel-fplnet"/><text x="606" y="40" class="xs b up t-fplnet" text-anchor="middle">BACKBONE</text><rect x="656" y="16" width="288" height="524" rx="12" class="panel-vieta"/><text x="670" y="40" xml:space="preserve"><tspan class="xs b up t-vieta">SITES</tspan><tspan class="xs i2">   Vieta, Minerva</tspan></text><text x="20" y="76" xml:space="preserve"><tspan class="b">TCP services</tspan><tspan class="s i2">   e.g. HTTP/1.1, HTTP/2</tspan></text><text x="20" y="310" xml:space="preserve"><tspan class="b">UDP/QUIC services</tspan><tspan class="s i2">   e.g. HTTP/3</tspan></text><path d="M28,88 L28,180" class="ln-fplnet"/><text transform="translate(20 134) rotate(-90)" text-anchor="middle" class="xs b up t-fplnet">EDGE</text><path d="M28,192 L28,284" class="ln-vieta"/><text transform="translate(20 238) rotate(-90)" text-anchor="middle" class="xs b up t-vieta">SITE</text><path d="M28,322 L28,414" class="ln-fplnet"/><text transform="translate(20 368) rotate(-90)" text-anchor="middle" class="xs b up t-fplnet">EDGE</text><path d="M28,426 L28,518" class="ln-vieta"/><text transform="translate(20 472) rotate(-90)" text-anchor="middle" class="xs b up t-vieta">SITE</text><rect x="34" y="89" width="50" height="17" rx="6" class="chip"/><text x="59" y="101.46" class="xs b" text-anchor="middle">IPv4</text><rect x="34" y="110" width="50" height="17" rx="6" class="chip"/><text x="59" y="122.46" class="xs b" text-anchor="middle">IPv6</text><rect x="90" y="88" width="126" height="40" rx="7" class="node"/><text x="153" y="104.5" class="mono s b" text-anchor="middle">fplnet.net</text><text x="153" y="119.5" class="xs i2" text-anchor="middle">any edge or f91::80</text><path d="M216,108 L308,108" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><rect x="233.274" y="99" width="49.4525" height="18" rx="9" class="pill"/><text x="258" y="112.32" class="xs b" text-anchor="middle">by SNI</text><rect x="34" y="141" width="50" height="17" rx="6" class="chip"/><text x="59" y="153.46" class="xs b" text-anchor="middle">IPv4</text><rect x="34" y="162" width="50" height="17" rx="6" class="chip"/><text x="59" y="174.46" class="xs b" text-anchor="middle">IPv6</text><rect x="90" y="140" width="126" height="40" rx="7" class="node"/><text x="153" y="156.5" class="mono s b" text-anchor="middle">lippok.dev</text><text x="153" y="171.5" class="xs i2" text-anchor="middle">via Cloudflare</text><path d="M216,160 L308,160" class="ln-fplnet" marker-end="url(#ah-fplnet)"/><rect x="233.274" y="151" width="49.4525" height="18" rx="9" class="pill"/><text x="258" y="164.32" class="xs b" text-anchor="middle">by SNI</text><rect x="34" y="200" width="50" height="24" rx="6" class="chip"/><text x="59" y="216.32" class="s b" text-anchor="middle">IPv4</text><rect x="90" y="192" width="126" height="40" rx="7" class="node"/><text x="153" y="208.5" class="mono s b" text-anchor="middle">*.relay</text><text x="153" y="223.5" class="xs i2" text-anchor="middle">any edge ¹</text><path d="M216,212 L308,212" class="ln-vieta" marker-end="url(#ah-vieta)"/><rect x="233.274" y="203" width="49.4525" height="18" rx="9" class="pill"/><text x="258" y="216.32" class="xs b" text-anchor="middle">by SNI</text><rect x="34" y="252" width="50" height="24" rx="6" class="chip"/><text x="59" y="268.32" class="s b" text-anchor="middle">IPv6</text><rect x="90" y="244" width="126" height="40" rx="7" class="node"/><text x="153" y="260.5" class="mono s b" text-anchor="middle">*.relay</text><text x="153" y="275.5" class="xs i2" text-anchor="middle">own address ¹</text><path d="M216,264 L570,264" class="ln-vieta" marker-end="url(#ah-vieta)"/><rect x="221.48" y="255" width="73.0397" height="18" rx="9" class="pill"/><text x="258" y="268.32" class="xs b" text-anchor="middle">by address</text><rect x="34" y="323" width="50" height="17" rx="6" class="chip"/><text x="59" y="335.46" class="xs b" text-anchor="middle">IPv4</text><rect x="34" y="344" width="50" height="17" rx="6" class="chip"/><text x="59" y="356.46" class="xs b" text-anchor="middle">IPv6</text><rect x="90" y="322" width="126" height="40" rx="7" class="node"/><text x="153" y="338.5" class="mono s b" text-anchor="middle">fplnet.net</text><text x="153" y="353.5" class="xs i2" te