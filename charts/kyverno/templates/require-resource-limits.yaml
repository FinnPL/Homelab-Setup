apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Memory Limit
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must declare CPU and memory requests and a memory limit.
      CPU limits are intentionally NOT required.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: ctnrs
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.ctnrs.all(c,
          c.?resources.?requests.?memory.hasValue() &&
          c.?resources.?requests.?cpu.hasValue() &&
          c.?resources.?limits.?memory.hasValue())
      message: "CPU+memory requests and a memory limit are required on all containers."
