apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-config
  namespace: dns
data:
  # IANA root trust anchors (https://data.iana.org/root-anchors/root-anchors.xml).
  root.ds: |
    . IN DS 20326 8 2 E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D
    . IN DS 38696 8 2 683D2D0ACB8C9B712A1948B27F741219298D0A450D612C483AF444A4C0FB2B16

  unbound.conf: |
    server:
      chroot: ""
      username: ""
      tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

      # Listen on loopback as Blocky is the only client
      interface: 127.0.0.1
      port: 5335

      do-ip4: yes
      do-ip6: no
      do-udp: yes
      do-tcp: yes

      access-control: 0.0.0.0/0 refuse
      access-control: 127.0.0.0/8 allow

      # dont reveal software version or identity
      hide-identity: yes
      hide-version: yes

      # QNAME minimisation reduces data leaked to upstream and intermediate NS
      qname-minimisation: yes

      # Run completely from memory, no need for pidfiles
      pidfile: ""

      # DNSSEC strict validation
      trust-anchor-file: "/usr/local/unbound/root.ds"
      val-permissive-mode: no

      prefetch: yes
      prefetch-key: yes
      serve-expired: yes
      serve-expired-ttl: 86400

      use-syslog: no
      logfile: ""
      verbosity: 0
      log-queries: no
      log-replies: no
      log-tag-queryreply: no
      log-servfail: yes

      num-threads: 1
      msg-cache-size: 32m
      rrset-cache-size: 64m

      extended-statistics: yes
      statistics-interval: 0

    forward-zone:
      name: "."
      forward-tls-upstream: yes
      forward-addr: 1.1.1.1@853#cloudflare-dns.com
      forward-addr: 1.0.0.1@853#cloudflare-dns.com

    remote-control:
      control-enable: yes
      control-interface: /tmp/unbound/unbound.ctl
      control-use-cert: no
