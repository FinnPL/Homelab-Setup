name: "Vieta: deploy"

# Single entrypoint for the three Vieta Terraform layers (the state bucket has state-bucket-deploy.yaml).
#   push to main      -> plan + apply only the changed layers, in order
#   pull_request      -> plan + comment the changed layers
#   workflow_dispatch -> manually run/apply a chosen layer (or all)

on:
  push:
    branches:
      - main
    paths:
      - "vieta/01-network/**"
      - "vieta/02-infrastructure/**"
      - "vieta/03-services/**"
      - "inventory/fplnet.json"
      - "inventory/vieta.json"
      - "inventory/trust/vault_user_ca.pub"
      - ".github/workflows/vieta-deploy.yaml"
      - ".github/workflows/_terraform-layer.yaml"
  pull_request:
    paths:
      - "vieta/01-network/**"
      - "vieta/02-infrastructure/**"
      - "vieta/03-services/**"
      - "inventory/fplnet.json"
      - "inventory/vieta.json"
      - "inventory/trust/vault_user_ca.pub"
      - ".github/workflows/vieta-deploy.yaml"
      - ".github/workflows/_terraform-layer.yaml"
  # The talos provider renews its own client certificate and the admin kubeconfig only when
  # the infra layer runs in their final month, so make sure it runs at least monthly.
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to run"
        type: choice
        default: all
        options:
          - all
          - vieta/01-network
          - vieta/02-infrastructure
          - vieta/03-services
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      network: ${{ steps.filter.outputs.network }}
      infra: ${{ steps.filter.outputs.infra }}
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: filter
        with:
          filters: |
            network:
              - 'vieta/01-network/**'
            infra:
              - 'vieta/02-infrastructure/**'
              - 'inventory/fplnet.json'
              - 'inventory/vieta.json'
              - 'inventory/trust/vault_user_ca.pub'
            services:
              - 'vieta/03-services/**'
              - 'inventory/fplnet.json'
              - 'inventory/vieta.json'

  deploy-network:
    needs: changes
    if: |
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.network == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.layer == 'all' || inputs.layer == 'vieta/01-network'))
    uses: ./.github/workflows/_terraform-layer.yaml
    secrets: inherit
    with:
      layer: vieta/01-network
      needs_homelab: true
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}

  deploy-infra:
    needs: [changes, deploy-network]
    if: |
      always() &&
      (needs.deploy-network.result == 'success' || needs.deploy-network.result == 'skipped') &&
      (
        github.event_name == 'schedule' ||
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.infra == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.layer == 'all' || inputs.layer == 'vieta/02-infrastructure'))
      )
    uses: ./.github/workflows/_terraform-layer.yaml
    secrets: inherit
    with:
      layer: vieta/02-infrastructure
      needs_homelab: true
      needs_ansible: true
      upgrade_cluster: true
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}

  deploy-services:
    needs: [changes, deploy-infra]
    if: |
      always() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.services == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.layer == 'all' || inputs.layer == 'vieta/03-services'))
      )
    uses: ./.github/workflows/_terraform-layer.yaml
    secrets: inherit
    with:
      layer: vieta/03-services
      needs_homelab: true
      needs_cluster_cert: true
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}
