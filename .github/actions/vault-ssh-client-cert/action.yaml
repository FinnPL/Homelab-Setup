name: "Vault SSH client certificate"
description: "Mint a throwaway keypair signed by the Vault user CA, and optionally pin the host CA that answers for it"

inputs:
  vault-addr:
    description: "Vault server URL"
    default: "https://vault.cloud.lippok.dev"
  role:
    description: "ssh-client-signer role to sign the keypair with (homelab, oci-edge)"
    required: true
  key-path:
    description: "Where to write the key and .pub. Defaults to a run-scoped temp path."
    default: ""
  host-ca-file:
    description: "Path to the Vault host CA public key, relative to the workspace. Set together with host-patterns."
    default: ""
  host-patterns:
    description: "Comma-separated known_hosts patterns to pin to the host CA. Leave both this and host-ca-file empty for callers that pin a single address themselves."
    default: ""

outputs:
  key-path:
    description: "Path to the signed private key; its -cert.pub sits alongside it"
    value: ${{ steps.mint.outputs.key-path }}

runs:
  using: composite
  steps:
    # Requires VAULT_TOKEN in the environment (vault-action with exportToken).
    - name: Mint SSH certificate
      id: mint
      shell: bash
      env:
        VAULT_ADDR: ${{ inputs.vault-addr }}
        ROLE: ${{ inputs.role }}
        KEY_PATH: ${{ inputs.key-path }}
        HOST_CA_FILE: ${{ inputs.host-ca-file }}
        HOST_PATTERNS: ${{ inputs.host-patterns }}
      run: |
        set -euo pipefail

        if [ -z "$ROLE" ]; then
          echo "::error::role is required (composite actions do not enforce required inputs)"
          exit 1
        fi

        if { [ -n "$HOST_PATTERNS" ] && [ -z "$HOST_CA_FILE" ]; } \
          || { [ -z "$HOST_PATTERNS" ] && [ -n "$HOST_CA_FILE" ]; }; then
          echo "::error::host-patterns and host-ca-file go together; set both or neither"
          exit 1
        fi

        key_path="${KEY_PATH:-$RUNNER_TEMP/vault_ssh_key}"
        key_path="${key_path/#\~/$HOME}"
        mkdir -p "$(dirname "$key_path")"

        rm -f "$key_path" "$key_path.pub" "$key_path-cert.pub"

        if [ -n "$HOST_PATTERNS" ]; then
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ca_line="@cert-authority $HOST_PATTERNS $(cat "${GITHUB_WORKSPACE}/${HOST_CA_FILE}")"
          if ! grep -qxF "$ca_line" ~/.ssh/known_hosts; then
            printf '%s\n' "$ca_line" >> ~/.ssh/known_hosts
          fi
        fi

        ssh-keygen -q -t ed25519 -N "" -C "gha-${GITHUB_RUN_ID}" -f "$key_path"
        signed=$(jq -n --rawfile pk "$key_path.pub" '{public_key: $pk}' \
          | curl -sS -f -X PUT \
              -H "X-Vault-Token: ${VAULT_TOKEN}" \
              --data-binary @- \
              "${VAULT_ADDR}/v1/ssh-client-signer/sign/${ROLE}" \
          | jq -r '.data.signed_key')
        if [ -z "$signed" ] || [ "$signed" = "null" ]; then
          echo "::error::Vault did not return a signed certificate for role $ROLE"
          exit 1
        fi
        printf '%s\n' "$signed" > "$key_path-cert.pub"
        ssh-keygen -Lf "$key_path-cert.pub" | grep -E 'Key ID|Valid:'
        echo "key-path=$key_path" >> "$GITHUB_OUTPUT"
