name: "Vault: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "vault/**"
      - ".github/workflows/vault-deploy.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token for Vault jwt login

concurrency:
  group: vault
  cancel-in-progress: false

jobs:
  terraform:
    name: "vault"
    runs-on: ubuntu-latest
    environment: vault
    defaults:
      run:
        working-directory: ./vault
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Terraform + AWS
        uses: ./.github/actions/tf-aws-setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Vault Login (GitHub OIDC)
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: vault-deploy
          jwtGithubAudience: ${{ vars.VAULT_ADDR }}
          exportToken: true

      - name: Terraform Plan
        run: terraform plan -lock-timeout=10m -out .planfile -input=false

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: terraform apply -lock-timeout=10m -auto-approve -input=false .planfile
