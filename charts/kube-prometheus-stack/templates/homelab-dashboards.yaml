{{- /* postgres.json is CloudNativePG's own dashboard (github.com/cloudnative-pg/grafana-dashboards, Apache-2.0). */}}
{{- range $path, $_ := .Files.Glob "dashboards/homelab/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $name }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-stack
  annotations:
    grafana_folder: "Homelab"
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
