{{- if .Values.bgpTools.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fplnet-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: fplnet.bgptools
      rules:
        - alert: BgpToolsScrapeFailing
          annotations:
            summary: bgp.tools Prometheus endpoint unreachable.
            description: The bgp-tools scrape job has failed for 30 minutes; FPLNET visibility alerts are blind.
          expr: up{job="bgp-tools"} == 0
          for: 30m
          labels:
            severity: warning

        - alert: FplnetPrefixNotVisible
          annotations:
            summary: "{{`{{ $labels.prefix }}`}} not seen by bgp.tools."
            description: bgp.tools sees no paths to an announced FPLNET prefix.
          expr: |
            (
              (
                {{- range $i, $prefix := .Values.bgpTools.prefixes }}
                {{ if $i }}or {{ end }}label_replace(vector(0), "prefix", "{{ $prefix }}", "", "")
                {{- end }}
              )
              unless on (prefix) bgptools_asn_prefix_visible{asn="{{ .Values.bgpTools.asn }}"} > 0
            )
            and on () up{job="bgp-tools"} == 1
          for: 15m
          labels:
            severity: critical

        - alert: FplnetUpstreamLost
          annotations:
            summary: "AS{{ .Values.bgpTools.asn }} has {{`{{ $value }}`}} upstreams, expected {{ .Values.bgpTools.expectedUpstreams }}."
            description: bgp.tools counts fewer upstreams than configured. Its upstream data updates every 4 hours.
          expr: bgptools_asn_upstreams{asn="{{ .Values.bgpTools.asn }}"} < {{ .Values.bgpTools.expectedUpstreams }}
          for: 5h
          labels:
            severity: warning
{{- end }}
{{- if .Values.fplnetRouters }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fplnet-router-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: fplnet.routers
      rules:
        - alert: FplnetRouterUnreachable
          annotations:
            summary: "{{`{{ $labels.router }}`}}: {{`{{ $labels.job }}`}} unreachable."
            description: Prometheus cannot scrape the router's exporter over gw1-aah1 and the backbone.
          expr: up{job=~"fplnet-(node|bird|smokeping)"} == 0
          for: 5m
          labels:
            severity: critical

        - alert: FplnetBgpSessionDown
          annotations:
            summary: "{{`{{ $labels.router }}`}}: BGP session {{`{{ $labels.name }}`}} down."
            description: A BGP session that was established within the last 7 days is not established.
          expr: |
            max by (router, name) (bird_protocol_up{job="fplnet-bird", proto="BGP"}) == 0
            and on (router, name)
            max by (router, name) (max_over_time(bird_protocol_up{job="fplnet-bird", proto="BGP"}[7d])) == 1
          for: 3m
          labels:
            severity: warning

        - alert: FplnetAnycastWithdrawn
          annotations:
            summary: "{{`{{ $labels.router }}`}}: not announcing the f91 edge anycast."
            description: anycast-f91.service withdraws 2a0c:b641:f91::/48 while fplnet.net does not answer on 2a0c:b641:f91::80 with a valid cert. The edge's IPv4 address still gets its share of visitors.
          expr: |
            max by (router) (up{job="fplnet-bird", router=~"er1-.*"}) == 1
            unless on (router) bird_protocol_up{job="fplnet-bird", name="anycast_f91"} == 1
          for: 10m
          labels:
            severity: warning

        - alert: FplnetUnitFailed
          annotations:
            summary: "{{`{{ $labels.router }}`}}: {{`{{ $labels.name }}`}} failed."
            description: A systemd unit on the router is in failed state. acme-order-renew-fplnet.net.service means the cert renewal failed; it runs again at the next daily timer.
          expr: node_systemd_unit_state{job="fplnet-node", state="failed"} == 1
          for: 15m
          labels:
            severity: warning

        - alert: FplnetRpkiCacheDown
          annotations:
            summary: "{{`{{ $labels.router }}`}}: RPKI cache {{`{{ $labels.name }}`}} down."
            description: The router has no RTR session to this Routinator. With no cache at all it keeps the last ROAs for 48 hours, then accepts RPKI-invalid routes.
          expr: bird_protocol_up{job="fplnet-bird", proto="RPKI"} == 0
          for: 30m
          labels:
            severity: warning

        - alert: FplnetRpkiValidatorDown
          annotations:
            summary: "{{`{{ $labels.router }}`}}: Routinator metrics unreachable."
            description: Routinator answers 503 until the first validation run after a start finishes, which takes over 10 minutes on er1-dus1's throttled disk. The edges use the other cache meanwhile.
          expr: up{job="fplnet-routinator"} == 0
          for: 45m
          labels:
            severity: warning

        - alert: FplnetRpkiValidatorStale
          annotations:
            summary: "{{`{{ $labels.router }}`}}: Routinator has not finished a validation run for an hour."
            description: Routinator keeps serving its last data set over RTR, so the routers see no failure while the ROAs age.
          expr: routinator_last_update_done{job="fplnet-routinator"} > 3600
          for: 30m
          labels:
            severity: warning

        - alert: FplnetRpkiVrpDrop
          annotations:
            summary: "{{`{{ $labels.router }}`}}: Routinator serves {{`{{ $value | humanizePercentage }}`}} of its VRPs a day ago."
            description: Fewer than 80% of yesterday's VRPs. Routes that lose their ROA turn from valid to unknown and are accepted.
          expr: |
            sum by (router) (routinator_total_vrps{job="fplnet-routinator"})
            / sum by (router) (routinator_total_vrps{job="fplnet-routinator"} offset 1d)
            < 0.8
          for: 30m
          labels:
            severity: warning

        - alert: FplnetLinkLoss
          annotations:
            summary: "{{`{{ $labels.router }}`}} -> {{`{{ $labels.target }}`}}: {{`{{ $value | humanizePercentage }}`}} packet loss."
            description: More than 5% of pings to a backbone peer, upstream neighbour or anchor were lost over 10 minutes.
          expr: |
            1 - sum by (router, target) (rate(smokeping_response_duration_seconds_count{job="fplnet-smokeping"}[10m]))
              / (sum by (router, target) (rate(smokeping_requests_total{job="fplnet-smokeping"}[10m])) > 0.1)
            > 0.05
          for: 10m
          labels:
            severity: warning

        - alert: FplnetLinkLatencyHigh
          annotations:
            summary: "{{`{{ $labels.router }}`}} -> {{`{{ $labels.target }}`}}: median RTT {{`{{ $value | humanizeDuration }}`}}."
            description: The median RTT over 10 minutes is more than twice its median over the last day, and at least 5 ms above it.
          expr: |
            histogram_quantile(0.5, sum by (le, router, target) (rate(smokeping_response_duration_seconds_bucket{job="fplnet-smokeping"}[10m])))
            > 2 * histogram_quantile(0.5, sum by (le, router, target) (rate(smokeping_response_duration_seconds_bucket{job="fplnet-smokeping"}[1d])))
            and
            histogram_quantile(0.5, sum by (le, router, target) (rate(smokeping_response_duration_seconds_bucket{job="fplnet-smokeping"}[10m])))
            - histogram_quantile(0.5, sum by (le, router, target) (rate(smokeping_response_duration_seconds_bucket{job="fplnet-smokeping"}[1d])))
            > 0.005
          for: 15m
          labels:
            severity: warning
{{- end }}
