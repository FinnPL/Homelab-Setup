apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      A read-only root filesystem prevents runtime writes to the container
      image layer, limiting the blast radius of a compromised container.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: ctnrs
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.ctnrs.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: "Containers must set securityContext.readOnlyRootFilesystem=true"
