crossplane:
  poolerMode: shared
  dedicatedPoolerPoolMode: transaction

gatus:
  externalConfigMap: gatus
  deployment:
    annotateConfigChecksum: false

  image:
    repository: twinproduction/gatus
    tag: v5.38.0

  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  env:
    GATUS_LOG_LEVEL: "WARN"
    DISCORD_WEBHOOK_URL:
      valueFrom:
        secretKeyRef:
          name: gatus-secrets
          key: webhook-url
    GATUS_DB_HOST:
      valueFrom:
        secretKeyRef:
          name: gatus-db-credentials
          key: endpoint
    GATUS_DB_PORT:
      valueFrom:
        secretKeyRef:
          name: gatus-db-credentials
          key: port
    GATUS_DB_USER:
      valueFrom:
        secretKeyRef:
          name: gatus-db-credentials
          key: username
    GATUS_DB_PASS:
      valueFrom:
        secretKeyRef:
          name: gatus-db-credentials
          key: password

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

  config:
    metrics: true

    storage:
      type: postgres
      path: "postgres://${GATUS_DB_USER}:${GATUS_DB_PASS}@${GATUS_DB_HOST}:${GATUS_DB_PORT}/gatus-db?sslmode=require"

    alerting:
      discord:
        webhook-url: "${DISCORD_WEBHOOK_URL}"

    endpoints:
      # Mail Servers
      - name: "Mail Server"
        group: "Mail"
        url: "icmp://mail.lippok.eu"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Mail Server HTTPS"
        group: "Mail"
        url: "https://mail.lippok.eu"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Mail IMAP"
        group: "Mail"
        url: "tcp://mail.lippok.eu:993"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Mail SMTP"
        group: "Mail"
        url: "tcp://mail.lippok.eu:587"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      # NAS
      - name: "Apollo NAS"
        group: "NAS"
        url: "https://apollo.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Zeus NAS"
        group: "NAS"
        url: "https://zeus.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Zeus NAS Ping"
        group: "NAS"
        url: "icmp://{{ .Values.inventory.minerva.hosts.zeus.dns }}"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      # Routers
      - name: "FritzBox"
        group: "Routers"
        url: "icmp://{{ .Values.inventory.minerva.fritzbox }}"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "FritzBox HTTPS"
        group: "Routers"
        url: "https://fb.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "DNS Vieta"
        group: "DNS"
        url: "{{ .Values.inventory.vieta.lan.loadBalancerIPs.dns }}"
        interval: 60s
        dns:
          query-name: "lippok.dev"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Router Vieta"
        group: "Routers"
        url: "icmp://{{ .Values.inventory.vieta.unifiController }}"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Router Minerva"
        group: "Routers"
        url: "icmp://{{ .Values.inventory.minerva.unifiController }}"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      # Over IPv6 this reaches er1-fra1
      - name: "fplnet.net"
        group: "FPLNET"
        url: "https://fplnet.net/healthz"
        interval: 60s
        client:
          network: ip6
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      # Servers
      - name: "Minerva Pi3"
        group: "Servers"
        url: "icmp://pi3.athena"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Vault"
        group: "Servers"
        url: "https://vault.cloud.lippok.dev/v1/sys/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].sealed == false"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Proxmox VE"
        group: "Servers"
        url: "https://pve.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      # K8s Websites
      - name: "ArgoCD"
        group: "Kubernetes"
        url: "https://argocd.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Authentik"
        group: "Kubernetes"
        url: "https://auth.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Grafana"
        group: "Kubernetes"
        url: "https://grafana.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Prometheus"
        group: "Kubernetes"
        url: "https://prometheus.lippok.dev/-/healthy"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Alertmanager"
        group: "Kubernetes"
        url: "https://alerts.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "IT-Tools"
        group: "Kubernetes"
        url: "https://it-tools.lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

      - name: "Website"
        group: "Web"
        url: "https://lippok.dev"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: discord
            failure-threshold: 3
            success-threshold: 2

fplnetRouterCheck:
  group: "FPLNET"
  interval: 60s
  client:
    network: ip6
  conditions:
    - "[CONNECTED] == true"
  alerts:
    - type: discord
      failure-threshold: 3
      success-threshold: 2

fplnetEdgeCheck:
  group: "FPLNET"
  interval: 60s
  client:
    network: ip4
  conditions:
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 240h"
  alerts:
    - type: discord
      failure-threshold: 3
      success-threshold: 2

vietaHosts:
  skip: [win]
  defaultGroup: "Servers"
  checks:
    nuc: { group: "Servers", name: "Intel NUC" }
    nfs: { group: "Servers", name: "NFS Server" }
    kvm: { group: "Servers", name: "JetKVM" }
    dietpi: { group: "Servers", name: "DietPi Subnet Router" }
    apollo: { group: "NAS", name: "Apollo NAS Ping" }
    cp1: { group: "K8s Nodes", name: "Talos Control Plane" }
    pi1: { group: "K8s Nodes", name: "Talos Worker 1" }
    pi2: { group: "K8s Nodes", name: "Talos Worker 2" }
    pi3: { group: "K8s Nodes", name: "Talos Worker 3" }
    db1: { group: "K8s Nodes", name: "Talos DB Worker" }

vietaHostCheck:
  interval: 60s
  conditions:
    - "[CONNECTED] == true"
  alerts:
    - type: discord
      failure-threshold: 3
      success-threshold: 2
