rl(#ah-vieta)"/><text x="20" y="566" font-size="12px" fill="#9b9b93">¹</text><text x="30" y="566" font-size="12px" fill="#9b9b93">No ECH for site services yet: waiting for a mature ECH split mode, as the edge must decrypt ECH for SNI routing.</text><text x="20" y="584" font-size="12px" fill="#9b9b93">²</text><text x="30" y="584" font-size="12px" fill="#9b9b93">No HTTP/3 for site services yet: still looking for a mature router that passes QUIC on by SNI.</text><text x="30" y="602" font-size="12px" fill="#9b9b93">One that does SNI routing with ECH split mode for both TCP and UDP/QUIC would solve ¹ and ² together.</text></svg>
